name: release-build

# C5-14 §6 stage 2 — the per-target release build (CR-5.2). The v1 builder
# is the existing GitHub hosted-runner fleet (the C4-28-proven labels; the
# hosted-runner selection is the owner's 2026-10-30 standing delegation of
# C5-14 §7.2). One job = one target = one ephemeral environment (§4.2).
# CGO is ON per D-09: internal/storage and cmd/uawp — the SQLite
# composition root — build only under the native CGO toolchain, so every
# row builds natively on its own runner.
#
# Each job emits the v1 raw artifact bundle for its row: the uawp binary,
# a SHA256SUMS digest file, the §5.1 provenance predicate record
# (cmd/genprovenance), and the C5-16 SPDX-2.3 SBOM of the binary (syft
# v1.55.0 — the generator/validator pin lives in the Core CR-5.2 C5-16
# SBOM Tooling Proof-before-Pin Record). The build step then packages the
# row's C5-15 §14 formats (Windows MSI / macOS pkg / Linux deb + rpm +
# portable — UNSIGNED BY DESIGN: every signing operation is the BLOCKED
# release-day stage, C5-13 §9.2, handover moment 1) and records the
# per-row package digests in PACKAGES-<row>.txt. The provenance record is
# a provenance-style attestation and the SBOM is a component inventory —
# NO SLSA or reproducible-build claim is made (C5-14 §5.4) and NO
# benignity claim (C5-16 §5). The build never holds signing keys
# (C5-13 §5.2).
#
# This workflow publishes NOTHING: artifacts live on the workflow run only
# (Software/AGENT.md 13 — release is owner-controlled). Triggers:
# workflow_dispatch (manual and C5-20 evidence runs) and v* tag pushes
# (the release cut). If GitHub retires a runner label, the affected row
# degrades honestly and this comment says so (the ci.yml convention).
#
# Two jobs: `build` (C5-14 §6 stage 2, the six rows above) and
# `verify-release-artifacts` (§6 stage 3 — the independent digest/
# provenance verification plus the stage-4 no-secret-bundle check; it
# comments its own checks in detail).
#
# The stamped version identifier: tag pushes stamp the tag; dispatch builds
# stamp the explicit non-release identifier "0.0.0-dev" — release version
# naming is a later CR-5.2 decision and the cmd/uawp scaffold rule ("this
# value is not a release version") stands until then. commit and buildDate
# complete the build-evidence protocol's stamped identity (version, commit,
# build date).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The C5-16 SBOM tooling, pinned by the Core CR-5.2 C5-16 SBOM Tooling
  # Proof-before-Pin Record (§1–§3; proof executed 2026-10-30): syft
  # v1.55.0 — the six per-platform archive digests each build row verifies
  # fail-closed before use — and the SPDX Project's official spdx-tools
  # validator, pinned exactly, which the verify job runs over every SBOM.
  SYFT_VERSION: "1.55.0"
  SPDX_TOOLS_VERSION: "0.8.3"
  # The C5-15 packaging toolchain pins (record-and-verify per C5-14 §7.3 —
  # the versions/digests are recorded here, printed in each packaging
  # step's log, and re-verified against the previous release's recorded
  # values at the release cut; no custom image build).
  # - WiX 3.14.1 (wix3141rtm) for both Windows rows' MSI: the binaries
  #   zip from the official wixtoolset/wix3 release, digest-pinned below
  #   and verified fail-closed before use. WHY NOT WiX 5/6/7: those
  #   toolsets gate every invocation behind the Open Source Maintenance
  #   Fee (OSMF) EULA — accepting it is a legal act the standing
  #   delegation does not cover (the first dispatch failed exactly there:
  #   WIX7015); v3.14.1 carries the classic MS-RL license with no EULA
  #   gate and supports arm64 MSIs. Wanting v7 is an explicit owner
  #   decision first. UNSIGNED — Authenticode is the BLOCKED release-day
  #   stage (C5-13 §9.2).
  WIX314_DIGEST: "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"

jobs:
  build:
    name: build ${{ matrix.row }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The six C5-11-approved rows; the runner labels are TODAY'S
          # labels (the same fleet the plugin-runtime-conformance matrix
          # proves per row).
          - { row: windows-amd64, runner: windows-latest,   goos: windows, goarch: amd64, ext: .exe }
          - { row: windows-arm64, runner: windows-11-arm,   goos: windows, goarch: arm64, ext: .exe }
          - { row: macos-amd64,   runner: macos-15-intel,   goos: darwin,  goarch: amd64, ext: "" }
          - { row: macos-arm64,   runner: macos-latest,     goos: darwin,  goarch: arm64, ext: "" }
          - { row: linux-amd64,   runner: ubuntu-latest,    goos: linux,   goarch: amd64, ext: "" }
          - { row: linux-arm64,   runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64, ext: "" }
    env:
      STAMP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
    steps:
      # Action tags are pinned to immutable commit SHAs (the ci.yml
      # supply-chain convention; C5-14 §4.2 item 2).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The windows images' Git ships core.autocrlf=true, which smudges the
      # checked-out go.mod/go.sum to CRLF. The stage-3 verification's
      # cross-row input-lock invariant (executed against run 40960623466's
      # bundles before this job shipped) caught the two windows rows
      # recording CRLF-rendition digests (287be873…/6afffeba…) while the
      # four Unix rows recorded the committed LF bytes (46fdba4e…/deec03d4…).
      # Re-checkout with autocrlf disabled pins the input-lock files to
      # their committed bytes so every row records the same digests (C5-14
      # §3: the input lock binds the REVISION, not a runner's working-copy
      # rendition; the §6 stage-3 job enforces the invariant).
      - name: pin the input-lock files to their committed bytes (Windows autocrlf guard)
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git checkout HEAD -- go.mod go.sum
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # The module cache is keyed by the locked go.sum hash and
          # re-verified by the toolchain (C5-14 §4.2 item 1).
          cache: true
      - name: install the native ARM64 C toolchain (windows/arm64 row only)
        if: matrix.row == 'windows-arm64'
        shell: bash
        run: |
          set -euo pipefail
          # The windows-11-arm hosted image's PATH gcc is the x86_64 MinGW
          # build — it cannot assemble the ARM64 runtime/cgo sources (the
          # second dispatch failed exactly there), so this row installs the
          # PINNED llvm-mingw aarch64-w64-mingw32 toolchain. The toolchain
          # is x86_64-hosted and runs under Windows-on-ARM emulation; its
          # exact version lands in the §5.1 record's c_compiler field
          # (record-and-verify, C5-14 §7.3) and the zip digest is printed
          # for the run log (C5-14 §4.2 item 5).
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          sha256sum "$RUNNER_TEMP/llvm-mingw.zip"
          mkdir -p /c/llvm-mingw
          /c/Windows/System32/tar.exe -xf "$RUNNER_TEMP/llvm-mingw.zip" -C /c/llvm-mingw
          echo 'C:\llvm-mingw\llvm-mingw-20261020-ucrt-x86_64\bin' >> "$GITHUB_PATH"
          echo "CC_NAME=C:/llvm-mingw/llvm-mingw-20261020-ucrt-x86_64/bin/aarch64-w64-mingw32-gcc.exe" >> "$GITHUB_ENV"
      - name: record builder and toolchain facts
        shell: bash
        run: |
          set -euo pipefail
          CC_BIN="${CC_NAME:-gcc}"
          if [ "$RUNNER_OS" = "macOS" ]; then CC_BIN=clang; fi
          {
            echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "GO_VERSION=$(go env GOVERSION)"
            echo "CC_VERSION=$("$CC_BIN" --version | head -n 1 | tr -d '\r')"
            echo "GO_MOD_SHA=$(sha256sum go.mod | cut -d' ' -f1)"
            echo "GO_SUM_SHA=$(sha256sum go.sum | cut -d' ' -f1)"
            echo "DEPMAP_VERSION=$(sed -n 's/^Contract version \([0-9.]*\).*/\1/p' docs/architecture/dependency-map.md | head -n 1)"
          } >> "$GITHUB_ENV"
      - name: build uawp (CGO on, -trimpath, stamped identity)
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ -n "${CC_NAME:-}" ]; then export CC="$CC_NAME"; fi
          STAMP_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X main.version=${STAMP_VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=${STAMP_DATE}"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/uawp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/uawp
          {
            echo "STAMP_DATE=${STAMP_DATE}"
            echo "LDFLAGS_USED=${LDFLAGS}"
          } >> "$GITHUB_ENV"
      - name: emit digests + the §5.1 provenance record
        shell: bash
        run: |
          set -euo pipefail
          ART="uawp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go run ./cmd/genprovenance \
            --artifact "dist/${ART}" \
            --name "${ART}" \
            --revision "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --runner-label "${{ matrix.runner }}" \
            --runner-image "${RUNNER_IMAGE}" \
            --go-version "${GO_VERSION}" \
            --cc-version "${CC_VERSION}" \
            --dependency-map-version "${DEPMAP_VERSION}" \
            --go-mod go.mod \
            --go-sum go.sum \
            --workflow ".github/workflows/release-build.yml" \
            --workflow-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --job "build ${{ matrix.row }}" \
            --cgo "1" \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --build-flags "-trimpath" \
            --build-ldflags "${LDFLAGS_USED}" \
            --build-date "${STAMP_DATE}" \
            --out "dist/${ART}.provenance.json"
          ( cd dist && sha256sum "${ART}" > "SHA256SUMS-${{ matrix.row }}.txt" )
      - name: emit the SPDX SBOM of the built binary (C5-16 §14)
        shell: bash
        run: |
          set -euo pipefail
          # The pinned SBOM generator (Core CR-5.2 C5-16 SBOM Tooling
          # Proof-before-Pin Record): the official syft v1.55.0 archive for
          # THIS runner, downloaded and verified fail-closed against the
          # pinned digest before use — the record-and-verify pattern of the
          # llvm-mingw step, upgraded to verify (C5-14 §4.2 item 5). Per-row
          # generation needs a uniform digest-pinned tool on all six rows;
          # trivy was rejected for exactly this step because its official
          # releases ship no windows-ARM64 binary (the record's §1).
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)     asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz";  expect="bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d" ;;
            Linux-ARM64)   asset="syft_${SYFT_VERSION}_linux_arm64.tar.gz";  expect="929bd163db2d7cd2255d3bcb8967208079813d7b46b0c952f7b794d8e2c7d304" ;;
            macOS-X64)     asset="syft_${SYFT_VERSION}_darwin_amd64.tar.gz"; expect="e2e5831cbabaec9a36fe65c34755c1113982c842a685edce3ce0b54a0ded8003" ;;
            macOS-ARM64)   asset="syft_${SYFT_VERSION}_darwin_arm64.tar.gz"; expect="1217c258bd5eb91ef3189cf22a82e02f9cac07e4ce934350f428e93aff674625" ;;
            Windows-X64)   asset="syft_${SYFT_VERSION}_windows_amd64.zip";   expect="ada4c9b93af575f479ce80fce6629897272a2d41f300a14bc49bace020767ca2" ;;
            Windows-ARM64) asset="syft_${SYFT_VERSION}_windows_arm64.zip";   expect="f52f7796e41e4d1ae511c228c99239fd09887077336dcb7a8c2aa7046ed7c816" ;;
            *) echo "syft: no pinned archive for runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/syft-archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${asset}"
          # GNU sha256sum escapes the whole output line with a leading
          # backslash when the hashed PATH contains backslashes — the
          # Windows $RUNNER_TEMP is a Windows path, so field 1 can carry
          # that escape prefix (the first dispatch's digest guard caught
          # exactly this). Strip it: the digest itself is bare hex.
          actual=$(sha256sum "$RUNNER_TEMP/syft-archive" | cut -d' ' -f1 | tr -d '\\')
          echo "syft ${SYFT_VERSION} archive ${asset} sha256 ${actual}"
          [ "$actual" = "$expect" ] || { echo "syft: archive digest mismatch (expected ${expect})" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/syft-bin"
          case "$asset" in
            *.zip) /c/Windows/System32/tar.exe -xf "$RUNNER_TEMP/syft-archive" -C "$RUNNER_TEMP/syft-bin" ;;
            *)     tar -xzf "$RUNNER_TEMP/syft-archive" -C "$RUNNER_TEMP/syft-bin" ;;
          esac
          ls -la "$RUNNER_TEMP/syft-bin"
          SYFT="$RUNNER_TEMP/syft-bin/syft"
          [ -x "$SYFT" ] || SYFT="$RUNNER_TEMP/syft-bin/syft.exe"
          [ -x "$SYFT" ] || { echo "syft: binary not found after extraction" >&2; exit 1; }
          ART="uawp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          # Generation: the Go module set (direct + transitive + stdlib) read
          # from the binary's embedded buildinfo — declared-dependency
          # granularity only (C5-16 §5 limits 1–2; licenseConcluded stays
          # NOASSERTION — no license conclusion before C5-22/D-31).
          "$SYFT" "dist/${ART}" -o "spdx-json=dist/${ART}.spdx.json"
          # Generation-time validation, fail-closed (C5-16 §14): the pinned
          # generator must DECODE its own document as an SBOM (syft convert
          # fails closed on non-SBOM or truncated input — negative-controlled
          # in the proof-before-pin record; a bare-path invocation would
          # merely catalog the file and exit 0 regardless of SBOM validity);
          # the required document fields are present; the subject binding —
          # the binary's exact sha256 — is inside the document. The
          # independent spec-level validation (official spdx-tools) runs in
          # the verify job.
          "$SYFT" convert "dist/${ART}.spdx.json" -o json > /dev/null
          grep -q '"spdxVersion":"SPDX-2.3"' "dist/${ART}.spdx.json"
          grep -q '"dataLicense":"CC0-1.0"' "dist/${ART}.spdx.json"
          grep -q '"SPDXID":"SPDXRef-DOCUMENT"' "dist/${ART}.spdx.json"
          grep -q '"creationInfo"' "dist/${ART}.spdx.json"
          grep -q "\"name\":\"${ART}\"" "dist/${ART}.spdx.json"
          grep -qF "$(sha256sum "dist/${ART}" | cut -d' ' -f1)" "dist/${ART}.spdx.json" \
            || { echo "syft: SBOM does not carry the binary's sha256 subject binding" >&2; exit 1; }
          echo "syft SBOM emitted + generation-validated: dist/${ART}.spdx.json"
      - name: package the row's native artifacts (C5-15 §14 formats)
        shell: bash
        run: |
          set -euo pipefail
          ART="uawp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          # The package version: a tag push stamps the tag (v-stripped);
          # dispatch builds use the explicit non-release identifier. MSI
          # ProductVersion must be numeric major.minor.build — normalize.
          V="$(printf '%s' "${STAMP_VERSION#v}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          [ -n "$V" ] || V="0.0.0"
          IFS='.' read -r A B C <<< "$V"; A=${A:-0}; B=${B:-0}; C=${C:-0}
          PKG_VERSION="${A}.${B}.${C}"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"
          # C5-15 §5.0 static guard (fail-closed): the packaging sources
          # carry NO user-data deletion — uninstall preserves data
          # structurally; explicit data deletion stays the separate
          # documented act (Blueprint §3.7). Any destructive command that
          # ever enters these sources fails the build.
          if grep -rEn '(rm[[:space:]]+(-[[:alnum:]]+[[:space:]]+)*-[a-zA-Z]*[rfR]|rmdir)' packaging/ ; then
            echo "packaging: destructive command found in packaging sources (C5-15 §5.0 violation)" >&2
            exit 1
          fi
          case "$RUNNER_OS" in
            Windows)
              # WiX 3.14.1 (digest-pinned, fail-closed): candle + light
              # build the per-user MSI per C5-15 §5.1 — product files
              # only, the data directory is not a component. See the
              # WIX314_DIGEST env comment for the v3-vs-v5+ toolchain
              # rationale (the OSMF EULA gate).
              curl -fsSL -o "$RUNNER_TEMP/wix314-binaries.zip" \
                https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
              actual=$(sha256sum "$RUNNER_TEMP/wix314-binaries.zip" | cut -d' ' -f1 | tr -d '\\')
              echo "wix314-binaries.zip sha256 ${actual}"
              [ "$actual" = "${WIX314_DIGEST}" ] || { echo "wix: archive digest mismatch (expected ${WIX314_DIGEST})" >&2; exit 1; }
              mkdir -p "$RUNNER_TEMP/wix314"
              /c/Windows/System32/tar.exe -xf "$RUNNER_TEMP/wix314-binaries.zip" -C "$RUNNER_TEMP/wix314"
              WIX="$RUNNER_TEMP/wix314"
              [ -f "$WIX/candle.exe" ] && [ -f "$WIX/light.exe" ] || { echo "wix: candle/light not found after extraction" >&2; exit 1; }
              if [ "${{ matrix.goarch }}" = "amd64" ]; then WIXARCH=x64; else WIXARCH=arm64; fi
              "$WIX/candle.exe" -arch "$WIXARCH" \
                -dProductVersion="${PKG_VERSION}" \
                -dBinaryPath="dist/${ART}" \
                -out "$RUNNER_TEMP/uawp.wixobj" \
                packaging/windows/uawp.wxs
              "$WIX/light.exe" -out "dist/karyora-core-${PKG_VERSION}-windows-${{ matrix.goarch }}.msi" \
                "$RUNNER_TEMP/uawp.wixobj"
              ;;
            macOS)
              # pkgbuild (the runner's native tool — the OS build itself
              # is the version anchor): the payload at /usr/local/bin/uawp,
              # the bounded postinstall from packaging/macos (C5-15 §5.2 —
              # data-preserving, fail-closed). UNSIGNED: Developer ID
              # signing + notarization are the BLOCKED release-day stage
              # (C5-13 §9.2). NOTE: pkgbuild's --version is the PACKAGE
              # version option, not a tool probe — the tool's version is
              # not printed (the first dispatch caught this).
              PKGROOT="$RUNNER_TEMP/pkgroot/bin"
              mkdir -p "$PKGROOT"
              cp "dist/${ART}" "$PKGROOT/uawp"
              chmod 755 "$PKGROOT/uawp"
              pkgbuild --identifier com.qira-dev.karyora-core \
                --version "${PKG_VERSION}" \
                --root "$RUNNER_TEMP/pkgroot" \
                --scripts packaging/macos \
                --install-location /usr/local \
                "dist/karyora-core-${PKG_VERSION}-macos-${{ matrix.goarch }}.pkg"
              ;;
            Linux)
              # deb (dpkg-deb is preinstalled): the maintainer scripts are
              # the data-preserving minimal set (C5-15 §5.0).
              dpkg-deb --version | head -n 1
              STAGE="$RUNNER_TEMP/deb-stage"
              mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/karyora/bin"
              cp "dist/${ART}" "$STAGE/opt/karyora/bin/uawp"
              sed -e "s/@VERSION@/${PKG_VERSION}/g" -e "s/@ARCH@/${{ matrix.goarch }}/g" \
                packaging/linux/deb/DEBIAN/control > "$STAGE/DEBIAN/control"
              for s in postinst prerm postrm; do
                cp "packaging/linux/deb/DEBIAN/$s" "$STAGE/DEBIAN/$s"
                chmod 755 "$STAGE/DEBIAN/$s"
              done
              dpkg-deb --build --root-owner-group "$STAGE" \
                "dist/karyora-core_${PKG_VERSION}_${{ matrix.goarch }}.deb"
              # rpm: the toolchain is installed per run and its version
              # printed for the log (the C5-14 §7.3 record-and-verify
              # pattern; no owner decision attached).
              sudo apt-get update -qq
              sudo apt-get install -y -qq rpm >/dev/null
              rpm --version
              RPMBUILD="$RUNNER_TEMP/rpmbuild"
              mkdir -p "$RPMBUILD/SOURCES" "$RPMBUILD/SPECS" "$RPMBUILD/BUILD" "$RPMBUILD/RPMS" "$RPMBUILD/SRPMS"
              cp "dist/${ART}" "$RPMBUILD/SOURCES/uawp-${{ matrix.goarch }}"
              if [ "${{ matrix.goarch }}" = "amd64" ]; then RPMARCH=x86_64; else RPMARCH=aarch64; fi
              rpmbuild -bb --define "_topdir $RPMBUILD" \
                --define "_uawp_version ${PKG_VERSION}" \
                --define "_uawp_arch_go ${{ matrix.goarch }}" \
                --define "_uawp_arch_rpm ${RPMARCH}" \
                packaging/rpm/uawp.spec
              find "$RPMBUILD/RPMS" -type f -name '*.rpm' \
                -exec cp {} "dist/karyora-core-${PKG_VERSION}-${RPMARCH}.rpm" \;
              # the portable archive (C5-15 §3.3): the SAME supported
              # Linux families, never an excluded environment (map rule 4)
              cp packaging/portable/README.md "dist/uawp-linux-${{ matrix.goarch }}-PORTABLE-README.md"
              tar -czf "dist/karyora-core-${PKG_VERSION}-linux-${{ matrix.goarch }}-portable.tar.gz" \
                -C dist "${ART}" "uawp-linux-${{ matrix.goarch }}-PORTABLE-README.md"
              rm "dist/uawp-linux-${{ matrix.goarch }}-PORTABLE-README.md"
              ;;
            *) echo "packaging: no format story for runner ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          # The per-row package digest file (sha256sum -c format; the row's
          # whole publishable package set). UNSIGNED — recorded, never
          # hidden (C5-13 §9.2).
          : > "dist/PACKAGES-${{ matrix.row }}.txt"
          for f in dist/karyora-core-*; do
            case "$f" in
              *.msi|*.pkg|*.deb|*.rpm|*portable.tar.gz)
                sha256sum "$f" >> "dist/PACKAGES-${{ matrix.row }}.txt" ;;
            esac
          done
          sed -i 's|dist/||' "dist/PACKAGES-${{ matrix.row }}.txt"
          ( cd dist && sha256sum -c "PACKAGES-${{ matrix.row }}.txt" )
          echo "packaging: $(grep -c . "dist/PACKAGES-${{ matrix.row }}.txt") package file(s) for row ${{ matrix.row }} (UNSIGNED — signing BLOCKED, C5-13 §9.2)"
      - name: upload the per-row artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.row }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify-release-artifacts:
    # C5-14 §6 stage 3 — the INDEPENDENT verification stage. The design's
    # binding rule (§3): digests are computed by the build job and
    # re-computed INDEPENDENTLY by a separate verification job; a digest the
    # second computation does not reproduce FAILS the pipeline. This job
    # runs on a different runner than every build row and does NOT check out
    # the source tree: it verifies the UPLOADED artifacts against the run's
    # own GitHub context (github.sha / github.ref / github.run_id supply the
    # truth), implementing the §5.2 verification policy mechanically at
    # build time (§5.3) with §5.2 item 4's fail-closed rule — a typed
    # refusal, never partial acceptance. The source tree is not needed: the
    # artifacts carry every fact this job checks.
    #
    # Checks, in order (any failure fails the job):
    #   1. Presence — all six per-row bundles (binary + SHA256SUMS + the §5.1
    #      provenance record) must exist; a missing row is a failure.
    #   2. Per row — the recomputed sha256 must equal BOTH the bundle's
    #      SHA256SUMS entry AND the record's subject.sha256; the record must
    #      carry the full §5.1 field set (validated against cmd/genprovenance's
    #      schema: presence + consistency — no drifting values are hardcoded;
    #      fields the run context supplies as truth are compared against it).
    #   3. Cross-row identity invariants — source.revision, source.ref,
    #      builder.workflow + workflow_commit, builder.run_id, and the
    #      input-lock triple (dependency-map version + go.mod/go.sum digests)
    #      must be IDENTICAL across all six records.
    #   4. The C5-16 SBOM per row (Core CR-5.2 C5-16 SBOM Tooling
    #      Proof-before-Pin Record): presence in the bundle; the required
    #      SPDX-2.3 document fields (jq, format-level); the subject
    #      binding — the document's single DESCRIBES relationship from
    #      SPDXRef-DOCUMENT must resolve to an element carrying the
    #      row's RECOMPUTED binary sha256; the module set (main module,
    #      stdlib, the D-09 go-sqlite3 driver); and the official
    #      spdx-tools validation over every SBOM (spec-level validity,
    #      independent of the generator). licenseConcluded stays
    #      NOASSERTION — no license conclusion before C5-22/D-31; the
    #      six C5-16 §5 completeness limits are carried by the
    #      proof-before-pin record, never silently omitted.
    #   5. The stage-4 release extension (C5-13 §9.1(2) "no build-time secret
    #      files shipped", bound via C5-15 §8) — a fast pattern scan over
    #      EVERY downloaded bundle file, binaries included. This mirrors the
    #      pre-push fast pattern-scan convention (Software/AGENT.md 14); the
    #      tree-level gitleaks/semgrep/trivy gate keeps running in ci.yml's
    #      security job — stage 4's main line. The private-key-block pattern
    #      targets the design's stated objects (PEM private-key blocks)
    #      rather than the bare -----BEGIN prefix, which false-positives on
    #      the Go standard library's compiled-in PEM header constants (e.g.
    #      crypto/tls's "-----BEGIN RSA TESTING KEY-----", verified against
    #      the run 40960623466 bundles). The C5-16 SBOM files are scanned
    #      like every other bundle file — no exception (confirmed in the
    #      log).
    #   6. The aggregated release-SHA256SUMS.txt over the whole publishable
    #      artifact set — the six binaries PLUS every row's C5-15 packages
    #      (recomputed HERE — never copied from the bundles, sha256sum -c
    #      format, sorted) is uploaded as the release-manifest artifact and
    #      every digest is printed: the logs are the audit record (§4.2
    #      item 5; there is no credential material in these artifacts). The
    #      manifest is carried UNMODIFIED into the release evidence bundle
    #      (§3; C5-32 consumes it).
    #   7. The C5-15 packages: per row the bundle carries its §14 format's
    #      package(s) (MSI / pkg / deb + rpm + portable, per-arch), every
    #      package digest matches BOTH its PACKAGES-<row>.txt entry and an
    #      independent recompute, and the set is recorded UNSIGNED (the
    #      signing stage is BLOCKED, C5-13 §9.2 — no signature check is
    #      faked; C5-15 §6's per-format verification paths run at the
    #      release cut once signing ships).
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Action tags are pinned to immutable commit SHAs (C5-14 §4.2 item 2).
      - name: download the six per-row bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: bundles
      - name: verify digests, provenance, cross-row identity, and the no-secret-bundle rule; emit the manifest
        env:
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Expected per-row bundle identity. The row set mirrors this
          # workflow's build matrix (same file, one maintenance unit); the
          # provenance record's per-row fields are checked against it so a
          # row cannot ship under another row's identity.
          ROWS=(
            "windows-amd64|uawp-windows-amd64.exe|windows|amd64|windows-latest"
            "windows-arm64|uawp-windows-arm64.exe|windows|arm64|windows-11-arm"
            "macos-amd64|uawp-darwin-amd64|darwin|amd64|macos-15-intel"
            "macos-arm64|uawp-darwin-arm64|darwin|arm64|macos-latest"
            "linux-amd64|uawp-linux-amd64|linux|amd64|ubuntu-latest"
            "linux-arm64|uawp-linux-arm64|linux|arm64|ubuntu-24.04-arm"
          )

          fail() { echo "verify-release-artifacts: FAIL: $*" >&2; exit 1; }
          hex64() { printf '%s' "$1" | grep -qE '^[0-9a-f]{64}$'; }

          # 1. Presence (fail-closed): every one of the six bundles.
          for spec in "${ROWS[@]}"; do
            IFS='|' read -r row art _goos _goarch _runner <<< "$spec"
            for f in "$art" "SHA256SUMS-${row}.txt" "${art}.provenance.json" "${art}.spdx.json"; do
              [ -f "bundles/$f" ] || fail "row=${row}: bundle file missing: bundles/$f"
            done
          done
          echo "verify-release-artifacts: all six bundles present (binary + SHA256SUMS + provenance record + C5-16 SBOM)"

          # 2 + 3. Per-row digest/provenance verification and the cross-row
          # identity invariants.
          prev_rev=""; prev_ref=""; prev_wf=""; prev_wfc=""; prev_rid=""; prev_dep=""; prev_gm=""; prev_gs=""
          for spec in "${ROWS[@]}"; do
            IFS='|' read -r row art goos goarch runner <<< "$spec"
            sums="bundles/SHA256SUMS-${row}.txt"
            rec="bundles/${art}.provenance.json"

            # The recomputed digest must match BOTH the bundle's SHA256SUMS
            # entry AND the provenance subject (§3, §5.2 item 1). Both
            # sha256sum line modes are accepted: text ("digest  name") and
            # the binary-mode marker the windows rows' sha256sum emits
            # ("digest *name") — both are standard `sha256sum -c` grammar.
            recomputed=$(sha256sum "bundles/$art" | cut -d' ' -f1)
            [ "$(wc -l < "$sums")" -eq 1 ] || fail "row=${row}: SHA256SUMS-${row}.txt must carry exactly one entry"
            grep -qE "^[0-9a-f]{64} [ *]${art}\$" "$sums" || fail "row=${row}: SHA256SUMS-${row}.txt is not sha256sum -c format for ${art}"
            sums_digest=$(awk '{print $1}' "$sums")
            [ "$recomputed" = "$sums_digest" ] || fail "row=${row}: recomputed sha256 ${recomputed} != SHA256SUMS entry ${sums_digest}"

            # The §5.1 record schema (cmd/genprovenance's v1 predicate).
            [ "$(jq -r '.record_type // empty' "$rec")" = "uawp-release-provenance" ] || fail "row=${row}: record_type is not uawp-release-provenance"
            [ "$(jq -r '.predicate // empty' "$rec")" = "uawp-build-provenance/v1" ] || fail "row=${row}: predicate is not uawp-build-provenance/v1"
            [ "$(jq -r '.subject.name // empty' "$rec")" = "$art" ] || fail "row=${row}: provenance subject.name != ${art}"
            subj=$(jq -r '.subject.sha256 // empty' "$rec")
            hex64 "$subj" || fail "row=${row}: provenance subject.sha256 is not a sha256 hex digest"
            [ "$subj" = "$recomputed" ] || fail "row=${row}: provenance subject.sha256 != recomputed digest"

            # Run-context truths: the record's run-bound fields must equal
            # THIS run's GitHub context.
            rev=$(jq -r '.source.revision // empty' "$rec")
            [ "$rev" = "$RUN_SHA" ] || fail "row=${row}: source.revision != the run's commit SHA (${RUN_SHA})"
            ref=$(jq -r '.source.ref // empty' "$rec")
            [ "$ref" = "$RUN_REF" ] || fail "row=${row}: source.ref != the run's ref (${RUN_REF})"
            wf=$(jq -r '.builder.workflow // empty' "$rec")
            [ "$wf" = ".github/workflows/release-build.yml" ] || fail "row=${row}: builder.workflow mismatch"
            wfc=$(jq -r '.builder.workflow_commit // empty' "$rec")
            [ "$wfc" = "$RUN_SHA" ] || fail "row=${row}: builder.workflow_commit != the run's commit SHA"
            rid=$(jq -r '.builder.run_id // empty' "$rec")
            [ "$rid" = "$RUN_ID" ] || fail "row=${row}: builder.run_id != this workflow run (${RUN_ID})"

            # Builder identity: present and consistent with the row.
            [ "$(jq -r '.builder.runner_label // empty' "$rec")" = "$runner" ] || fail "row=${row}: builder.runner_label != the row's runner (${runner})"
            [ -n "$(jq -r '.builder.runner_image // empty' "$rec")" ] || fail "row=${row}: builder.runner_image missing"
            [ "$(jq -r '.builder.job // empty' "$rec")" = "build ${row}" ] || fail "row=${row}: builder.job != build ${row}"

            # Toolchain + input lock: present, well-formed.
            [ -n "$(jq -r '.toolchain.go // empty' "$rec")" ] || fail "row=${row}: toolchain.go missing"
            [ -n "$(jq -r '.toolchain.c_compiler // empty' "$rec")" ] || fail "row=${row}: toolchain.c_compiler missing"
            dep=$(jq -r '.input_lock.dependency_map_version // empty' "$rec")
            [ -n "$dep" ] || fail "row=${row}: input_lock.dependency_map_version missing"
            gm=$(jq -r '.input_lock.go_mod_sha256 // empty' "$rec")
            hex64 "$gm" || fail "row=${row}: input_lock.go_mod_sha256 is not a sha256 hex digest"
            gs=$(jq -r '.input_lock.go_sum_sha256 // empty' "$rec")
            hex64 "$gs" || fail "row=${row}: input_lock.go_sum_sha256 is not a sha256 hex digest"

            # Environment facts: the design-fixed values and the row's target.
            [ "$(jq -r '.environment.cgo_enabled // empty' "$rec")" = "1" ] || fail "row=${row}: environment.cgo_enabled != 1 (release builds are native CGO builds, D-09)"
            [ "$(jq -r '.environment.goos // empty' "$rec")" = "$goos" ] || fail "row=${row}: environment.goos != ${goos}"
            [ "$(jq -r '.environment.goarch // empty' "$rec")" = "$goarch" ] || fail "row=${row}: environment.goarch != ${goarch}"
            jq -e '(.environment.build_flags | type == "array") and (.environment.build_flags | length > 0)' "$rec" >/dev/null 2>&1 \
              || fail "row=${row}: environment.build_flags missing or empty"
            flags=$(jq -r '.environment.build_flags | join(" ")' "$rec")
            case "$flags" in *-trimpath*) ;; *) fail "row=${row}: build_flags do not include -trimpath";; esac
            case "$flags" in *"main.version="*) ;; *) fail "row=${row}: stamped main.version missing from build_flags";; esac
            case "$flags" in *"main.commit=${RUN_SHA}"*) ;; *) fail "row=${row}: stamped main.commit != the run's commit SHA";; esac
            case "$flags" in *"main.buildDate="*) ;; *) fail "row=${row}: stamped main.buildDate missing from build_flags";; esac
            ts=$(jq -r '.environment.build_timestamp_utc // empty' "$rec")
            printf '%s' "$ts" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$' \
              || fail "row=${row}: environment.build_timestamp_utc is not RFC3339 UTC (${ts:-missing})"

            # 4. The C5-16 SBOM (Core CR-5.2 C5-16 SBOM Tooling
            # Proof-before-Pin Record): required document fields, the
            # subject binding, and the module set. The spec-level official
            # validation of every SBOM runs once after this loop.
            sbom="bundles/${art}.spdx.json"
            [ "$(jq -r '.spdxVersion // empty' "$sbom")" = "SPDX-2.3" ] || fail "row=${row}: SBOM spdxVersion is not SPDX-2.3"
            [ "$(jq -r '.dataLicense // empty' "$sbom")" = "CC0-1.0" ] || fail "row=${row}: SBOM dataLicense is not CC0-1.0"
            [ "$(jq -r '.SPDXID // empty' "$sbom")" = "SPDXRef-DOCUMENT" ] || fail "row=${row}: SBOM SPDXID is not SPDXRef-DOCUMENT"
            [ "$(jq -r '.name // empty' "$sbom")" = "$art" ] || fail "row=${row}: SBOM document name != ${art}"
            [ -n "$(jq -r '.creationInfo.created // empty' "$sbom")" ] || fail "row=${row}: SBOM creationInfo.created missing"
            jq -e --arg v "Tool: syft-${SYFT_VERSION}" 'any(.creationInfo.creators[]?; . == $v)' "$sbom" >/dev/null 2>&1 \
              || fail "row=${row}: SBOM creationInfo.creators missing Tool: syft-${SYFT_VERSION} (the pinned generator)"
            # Subject binding, digest-exact: the document's single DESCRIBES
            # relationship from SPDXRef-DOCUMENT must resolve to one element
            # whose checksums carry the RECOMPUTED binary sha256 (above).
            dtarget=$(jq -r '[.relationships[] | select(.relationshipType == "DESCRIBES" and .spdxElementId == "SPDXRef-DOCUMENT") | .relatedSpdxElement] | if length == 1 then .[0] else empty end' "$sbom")
            [ -n "$dtarget" ] || fail "row=${row}: SBOM must carry exactly one DESCRIBES relationship from SPDXRef-DOCUMENT"
            jq -e --arg t "$dtarget" --arg d "$recomputed" \
              '([.packages[], .files[]] | map(select(.SPDXID == $t)) | length == 1)
               and
               ((([.packages[], .files[]] | map(select(.SPDXID == $t)) | .[0].checksums) // [])
                  | map(select(.algorithm == "SHA256" and .checksumValue == $d)) | length > 0)' \
              "$sbom" >/dev/null 2>&1 \
              || fail "row=${row}: SBOM DESCRIBES target does not carry the recomputed subject sha256"
            # The module set (declared-dependency granularity, C5-16 §5
            # limit 1): the main module, the stdlib, and the D-09 driver
            # identity must be present. Versions are NOT asserted here —
            # the release-time binding records compare them against the
            # C5-12 lock (C5-21/C5-32).
            jq -e '.packages[]? | select(.name == "github.com/qira-dev/karyora")' "$sbom" >/dev/null 2>&1 \
              || fail "row=${row}: SBOM missing the main module package"
            jq -e '.packages[]? | select(.name == "stdlib") | select((.versionInfo // "") | test("^go"))' "$sbom" >/dev/null 2>&1 \
              || fail "row=${row}: SBOM missing the stdlib package"
            jq -e '.packages[]? | select(.name == "github.com/mattn/go-sqlite3")' "$sbom" >/dev/null 2>&1 \
              || fail "row=${row}: SBOM missing the go-sqlite3 package (the D-09 driver identity)"

            # Cross-row identity invariants: every row must share the same
            # values (§6 stage 3; any divergence is a failure).
            if [ -n "$prev_rev" ]; then
              [ "$rev" = "$prev_rev" ] || fail "cross-row: source.revision diverges at row=${row}"
              [ "$ref" = "$prev_ref" ] || fail "cross-row: source.ref diverges at row=${row}"
              [ "$wf" = "$prev_wf" ] || fail "cross-row: builder.workflow diverges at row=${row}"
              [ "$wfc" = "$prev_wfc" ] || fail "cross-row: builder.workflow_commit diverges at row=${row}"
              [ "$rid" = "$prev_rid" ] || fail "cross-row: builder.run_id diverges at row=${row}"
              [ "$dep" = "$prev_dep" ] || fail "cross-row: input_lock.dependency_map_version diverges at row=${row}"
              [ "$gm" = "$prev_gm" ] || fail "cross-row: input_lock.go_mod_sha256 diverges at row=${row}"
              [ "$gs" = "$prev_gs" ] || fail "cross-row: input_lock.go_sum_sha256 diverges at row=${row}"
            fi
            prev_rev="$rev"; prev_ref="$ref"; prev_wf="$wf"; prev_wfc="$wfc"; prev_rid="$rid"; prev_dep="$dep"; prev_gm="$gm"; prev_gs="$gs"

            echo "verify-release-artifacts: row=${row} OK (subject ${recomputed})"
          done

          # 4 (cont.). The official SPDX validation of every row's SBOM —
          # spec-level validity from the format owner's own validator
          # (spdx-tools, pinned exactly by the proof-before-pin record),
          # independent of the generator. pyspdxtools is silent on valid
          # documents and exits nonzero with a typed error otherwise (its
          # fail-closed behavior was proven against a tampered document
          # before this pin).
          pip install --disable-pip-version-check --quiet "spdx-tools==${SPDX_TOOLS_VERSION}"
          for spec in "${ROWS[@]}"; do
            IFS='|' read -r row art _goos _goarch _runner <<< "$spec"
            pyspdxtools --infile "bundles/${art}.spdx.json" \
              || fail "row=${row}: the official SPDX validator (spdx-tools ${SPDX_TOOLS_VERSION}) rejected ${art}.spdx.json"
          done
          echo "verify-release-artifacts: all six SBOMs validate against SPDX-2.3 (official spdx-tools ${SPDX_TOOLS_VERSION})"

          # 5. Stage-4 extension: no build-time secret material in ANY
          # downloaded bundle file. The private-key-block pattern is the
          # design's stated target (PEM private-key blocks) — see the job
          # comment for why the bare -----BEGIN prefix is not used. The
          # credential-assignment shapes are matched case-insensitively.
          pem_pat='-----BEGIN( [A-Z0-9]+)* PRIVATE KEY( BLOCK)?-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_|xox[baprs]-'
          ci_pat='password[[:space:]]*=|api[_-]?key[[:space:]]*='
          hits=$(grep -rlE -- "$pem_pat" bundles/ || true)
          [ -z "$hits" ] || fail "bundle secret-scan (stage-4 extension, C5-13 §9.1(2)) hit secret-shaped material in: $(echo "$hits" | tr '\n' ' ')"
          hits=$(grep -rliE -- "$ci_pat" bundles/ || true)
          [ -z "$hits" ] || fail "bundle secret-scan (stage-4 extension, C5-13 §9.1(2)) hit credential-shaped material in: $(echo "$hits" | tr '\n' ' ')"
          echo "verify-release-artifacts: bundle secret-scan clean over every downloaded file"
          # Explicit confirmation (C5-16): the SBOM documents were inside
          # the scanned set above — no exception was made for them.
          echo "verify-release-artifacts: the no-secret scan included the C5-16 SBOM documents ($(find bundles -name '*.spdx.json' | wc -l) file(s))"

          # 7. The C5-15 packages (the owner's §14 format set: Windows
          # MSI / macOS pkg / Linux deb + rpm + portable; per-arch):
          # per row the bundle must carry its format's package(s), and
          # every package's digest must equal BOTH its PACKAGES-<row>.txt
          # entry AND an independent recompute here. The packages are
          # UNSIGNED BY DESIGN — the signing stage is BLOCKED (C5-13
          # §9.2), so no signature check exists yet and none is faked;
          # the C5-15 §6 verification paths run at the release cut once
          # signing ships.
          pkgfail() { echo "verify-release-artifacts: FAIL (packages): $*" >&2; exit 1; }
          for spec in "${ROWS[@]}"; do
            IFS='|' read -r row _art goos _goarch _runner <<< "$spec"
            pf="bundles/PACKAGES-${row}.txt"
            [ -f "$pf" ] || pkgfail "row=${row}: PACKAGES-${row}.txt missing"
            case "$goos" in
              windows)
                [ -n "$(find bundles -maxdepth 1 -name 'karyora-core-*-windows-*.msi')" ] \
                  || pkgfail "row=${row}: the MSI package is missing (C5-15 §14)" ;;
              darwin)
                [ -n "$(find bundles -maxdepth 1 -name 'karyora-core-*-macos-*.pkg')" ] \
                  || pkgfail "row=${row}: the pkg package is missing (C5-15 §14)" ;;
              linux)
                [ -n "$(find bundles -maxdepth 1 -name 'karyora-core_*.deb')" ] \
                  || pkgfail "row=${row}: the deb package is missing (C5-15 §14)"
                [ -n "$(find bundles -maxdepth 1 -name 'karyora-core-*.rpm')" ] \
                  || pkgfail "row=${row}: the rpm package is missing (C5-15 §14)"
                [ -n "$(find bundles -maxdepth 1 -name 'karyora-core-*-portable.tar.gz')" ] \
                  || pkgfail "row=${row}: the portable archive is missing (C5-15 §14)" ;;
            esac
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              d=$(printf '%s' "$line" | awk '{print $1}')
              name=$(printf '%s' "$line" | sed -E 's/^[0-9a-f]{64}[[:space:]]+\*?//')
              hex64 "$d" || pkgfail "row=${row}: PACKAGES digest for ${name} is not sha256 hex"
              [ -f "bundles/$name" ] || pkgfail "row=${row}: PACKAGES names a missing file: ${name}"
              rd=$(sha256sum "bundles/$name" | cut -d' ' -f1)
              [ "$rd" = "$d" ] || pkgfail "row=${row}: package ${name} recomputed ${rd} != PACKAGES entry ${d}"
            done < "$pf"
            echo "verify-release-artifacts: row=${row} packages OK ($(grep -c . "$pf") file(s), unsigned)"
          done

          # 8. The aggregated manifest, recomputed HERE over the whole
          # publishable artifact set — the six binaries PLUS every row's
          # C5-15 packages (C5-15 §2: one row = one artifact set) — never
          # copied from the bundles' own files; sha256sum -c format,
          # sorted by filename, self-checked, and printed. The manifest
          # is carried UNMODIFIED into the release evidence bundle
          # (C5-14 §3; C5-32 consumes it).
          : > release-SHA256SUMS.txt
          for spec in "${ROWS[@]}"; do
            IFS='|' read -r row art _goos _goarch _runner <<< "$spec"
            d=$(sha256sum "bundles/$art" | cut -d' ' -f1)
            printf '%s  %s\n' "$d" "$art" >> release-SHA256SUMS.txt
            echo "verify-release-artifacts: manifest ${art} sha256 ${d}"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              d=$(printf '%s' "$line" | awk '{print $1}')
              name=$(printf '%s' "$line" | sed -E 's/^[0-9a-f]{64}[[:space:]]+\*?//')
              printf '%s  %s\n' "$d" "$name" >> release-SHA256SUMS.txt
              echo "verify-release-artifacts: manifest ${name} sha256 ${d}"
            done < "bundles/PACKAGES-${row}.txt"
          done
          sort -k2 -o release-SHA256SUMS.txt release-SHA256SUMS.txt
          ( cd bundles && sha256sum -c ../release-SHA256SUMS.txt )
          echo "verify-release-artifacts: release-SHA256SUMS.txt emitted and self-checked"
          echo "verify-release-artifacts: PASS (6/6 rows verified incl. the C5-15 packages)"
      - name: upload the aggregated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: release-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
