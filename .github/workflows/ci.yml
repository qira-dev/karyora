name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The remotestore conformance fixtures (CR-4.4 sub-milestone B) run
    # against a live PostgreSQL inside CI — the server floor per the
    # prepared D-10 record is 16–18, so CI rides 17. The credential below
    # is an ephemeral job-local container credential, not a secret.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: karyora
          POSTGRES_PASSWORD: karyora-ci-ephemeral
          POSTGRES_DB: karyora_rs_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U karyora -d karyora_rs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The C4-36 object fixtures ride the same live-ephemeral pattern.
      # The credentials are job-local and throwaway, not secrets; the
      # endpoint is this job's own local target (Rule 14's own-target
      # boundary). The MinIO community server was ARCHIVED upstream
      # (2026-04-24; dl.min.io binaries, GitHub release assets and every
      # public container image — Docker Hub/ghcr/quay/bitnami — probed
      # 2026-10-29 and no longer pullable), so the leg builds the final
      # community release tag RELEASE.2025-10-15T17-29-55Z from its own
      # source and runs it as this job's local live target — the same
      # vendor/version the local conformance fixtures verified.
      MINIO_CI_ENDPOINT: 127.0.0.1:19000
      MINIO_CI_BUCKET: karyora-objects
      MINIO_ROOT_USER: karyora-ci-ephemeral
      MINIO_ROOT_PASSWORD: karyora-ci-ephemeral-minio
    steps:
      # Action tags are pinned to immutable commit SHAs (semgrep
      # github-actions-mutable-action-tag; supply-chain policy).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: start the MinIO live target (source-built, archived community release)
        run: |
          git clone --depth 1 --branch RELEASE.2025-10-15T17-29-55Z \
            https://github.com/minio/minio.git /tmp/minio-src
          go build -C /tmp/minio-src -trimpath -o /tmp/minio-server .
          mkdir -p /tmp/minio-data
          /tmp/minio-server server /tmp/minio-data \
            --address 127.0.0.1:19000 --console-address 127.0.0.1:19001 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19000/minio/health/ready >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MinIO live target did not become ready" >&2
          exit 1
      - name: go test with the race detector (includes the dependency-rule check)
        env:
          REMOTESTORE_TEST_DSN: postgres://karyora:karyora-ci-ephemeral@localhost:55432/karyora_rs_test
          REMOTESTORE_TEST_S3_ENDPOINT: 127.0.0.1:19000
          REMOTESTORE_TEST_S3_ACCESS_KEY: karyora-ci-ephemeral
          REMOTESTORE_TEST_S3_SECRET_KEY: karyora-ci-ephemeral-minio
          REMOTESTORE_TEST_S3_BUCKET: karyora-objects
        run: go test -race ./...

  security:
    # The Rule 14 security-pipeline mirror (Software/AGENT.md 9 and 14;
    # project AGENT.md 18): secret, code, and dependency scanning must pass
    # before any milestone may record a gate. The live (nuclei) and
    # injection (sqlmap) stages stay Not Run in CI — there is no live
    # target; that is a recorded Not Run, never a silent skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks audits the published history too
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gitleaks (secret scan)
        run: |
          # v8.30.1 still declares the module path github.com/zricethezav/gitleaks/v8
          # even though the repository moved to the gitleaks org.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --no-banner --redact
      - name: semgrep (code scan)
        run: |
          pip install --disable-pip-version-check "semgrep==1.182.1"
          semgrep scan --config p/ci --error
      - name: trivy (dependency scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'

  cross-target:
    # Compile-only cross-target matrix (Software/AGENT.md 9; Blueprint D-06
    # six locked rows). Per D-09 a Go-only cross-build never proves the
    # CGO-bound SQLite driver, so internal/storage — and cmd/uawp, the
    # composition root that imports it — build only under the native CGO
    # toolchain in the verify job; their cross-target linked-runtime
    # evidence remains the recorded Phase 5 D-06 work. tests/deps is the
    # test-only rule runner and is covered by go test in verify.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: compile-only build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build $(go list ./... | grep -v -e '/internal/storage' -e '/tests/deps' -e '/cmd/uawp')

  plugin-runtime-conformance:
    # C4-28 cross-target RUNTIME evidence for the enforced plugin boundary
    # (CR-4.3): the internal/pluginhost enforcement fixtures and the
    # internal/plugins contract tests EXECUTE on real hosted runners for
    # every D-06 row that has one, extending the compile-only matrix above
    # with measured runtime behavior of the quota/cancellation/
    # authorization/containment boundary. Pure-Go packages only (no CGO,
    # no platform package), so the whole suite stays on linux/amd64 in
    # verify; these legs measure the plugin boundary per target. darwin
    # amd64 rides the macos-15-intel hosted runner (the macos-13 Intel
    # pool saturated for public repos at C4-28 time) and windows ARM64
    # rides the windows-11-arm hosted runner (public repos); if GitHub
    # retires a label the affected row degrades honestly to compile-only
    # and this comment says so.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64 }
          - { runner: macos-latest, goos: darwin, goarch: arm64 }
          - { runner: windows-latest, goos: windows, goarch: amd64 }
          - { runner: windows-11-arm, goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: enforcement fixtures (${{ matrix.goos }}/${{ matrix.goarch }})
        run: go test -count=1 ./internal/pluginhost ./internal/plugins
