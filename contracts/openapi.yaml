        pack_id: { type: string }
        version_id: { type: string, description: 'The exact version to export; absent = the pack''s current version.' }
        destination: { type: string, description: 'The destination descriptor — displayed before generation, never assumed.' }
        external_transfer_confirmed:
          type: boolean
          description: The explicit pre-submit confirmation for the external-transfer boundary (UI §24.4).
    KnowledgeOperationKind:
      type: string
      description: The closed knowledge-operation kind register — import | export.
    KnowledgeOperationState:
      type: string
      description: >-
        The closed knowledge-operation state register — submitted |
        uploading | extracting | validating | indexing | generating |
        completed | rejected | failed | cancelled | outcome_unknown. The
        import stage vocabulary `Uploading → Extracting → Validating →
        Indexing` (UI §14.4) is emitted from ACTUAL Core stages only as
        F10-shaped events (`import.stage_entered`) — progress is never a
        fabricated percentage and no percentage member exists. `rejected`
        and `failed` carry the explicit failure code and reason (the
        MB §6.3 explicit-failure list: dependency cycle, invalid signature,
        unsupported schema, revoked trust, digest mismatch, license-policy
        failure each produce an EXPLICIT failure or quarantine — never a
        suppressed warning). `cancelled` is Core-confirmed only.
        `outcome_unknown` is the S0–S4 OUTCOME_UNKNOWN surface: a timeout
        or lost response is never proof of success, cancellation, or safe
        retry — reconcile by the operation ID through the authoritative
        state read.
    KnowledgeOperation:
      type: object
      description: One knowledge operation's authoritative record (import or export) — the state endpoint's payload.
      required: [operation_id, kind, state, correlation_id, created_at, updated_at]
      properties:
        operation_id: { type: string }
        kind: { $ref: '#/components/schemas/KnowledgeOperationKind' }
        state: { $ref: '#/components/schemas/KnowledgeOperationState' }
        correlation_id: { type: string, description: 'The operation''s correlation ID — the identity a lost response reconciles through.' }
        failure_code: { type: string, description: 'The coded failure (the family''s register codes) on rejected/failed; empty otherwise.' }
        failure_reason: { type: string, description: 'The Core-supplied explicit reason — the honest statement, never a suppressed warning.' }
        result: { $ref: '#/components/schemas/KnowledgeOperationResult' }
        untrusted_label: { $ref: '#/components/schemas/UntrustedLabel' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KnowledgeOperationResult:
      type: object
      description: >-
        One operation's Core-confirmed result — what persists (artifact,
        pack-version reference, derived indexes) and what the retention
        policy applies; no erasure claim beyond Core-confirmed scope.
        Present only once the operation carries it.
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/KnowledgeOperationKind' }
        pack_id: { type: string, description: 'The import''s pack-version reference''s pack identity.' }
        version_id: { type: string, description: 'The import''s pack-version reference''s version identity.' }
        export_ref: { type: string, description: 'The export artifact''s reference.' }
        digest:
          type: string
          description: >-
            The produced bytes' digest where one is produced. The
            algorithm-qualified digest form `sha256:<lowercase-hex>` is
            carried as a value format for description only — the D-41
            portable digest profile stays behind its owner
            technical/security gate; this contract does not approve SHA-256
            or any algorithm as the permanent digest profile.
    KnowledgeOperationSubmitResult:
      type: object
      description: One submit's accepted outcome — the operation reference (replayed=true on the M-9 same-digest replay).
      required: [operation, replayed]
      properties:
        operation: { $ref: '#/components/schemas/KnowledgeOperation' }
        replayed: { type: boolean }
    KnowledgeErrorCode:
      type: string
      description: >-
        The KnowledgePack family's domain codes added to the coded error
        register (F1) additively at the 2026-11-07 publication act — each
        riding the published ErrorEnvelope with its retryable value and the
        coded retryClass. The MB §6.3 explicit-failure list:
        KNOWLEDGE_DEPENDENCY_CYCLE, KNOWLEDGE_SIGNATURE_INVALID,
        KNOWLEDGE_SCHEMA_UNSUPPORTED, KNOWLEDGE_TRUST_REVOKED,
        KNOWLEDGE_DIGEST_MISMATCH, KNOWLEDGE_LICENSE_POLICY_FAIL (each
        never — explicit failures never retry). The import rejection
        vocabulary: IMPORT_TYPE_UNSUPPORTED, IMPORT_SIZE_OVER_LIMIT,
        IMPORT_MALFORMED, IMPORT_DUPLICATE_DIGEST,
        IMPORT_PERMISSION_DENIED, IMPORT_POLICY_BLOCKED,
        IMPORT_INTEGRITY_SIGNATURE_FAILURE (each never),
        IMPORT_NETWORK_INTERRUPTED (backoff — transient network). The
        idempotency/state conflicts ride the PUBLISHED codes exactly —
        CONFLICT_IDEMPOTENCY_KEY (same key + different bytes; the M-9
        fingerprintMatch:false datum in data) and CONFLICT_STATE (replay
        past the window).
    KnowledgeEventAggregateType:
      type: string
      description: >-
        The KnowledgePack family's F10 aggregate types — knowledgePack |
        knowledgePackVersion | knowledgeImportOperation |
        knowledgeExportOperation.
    KnowledgeEventType:
      type: string
      description: >-
        The KnowledgePack family's F10 event_type vocabulary —
        pack.created | pack_version.created | pack_version.superseded |
        import.submitted | import.stage_entered | import.completed |
        import.rejected | import.cancelled | export.submitted |
        export.completed | export.failed. `import.stage_entered` carries
        the `Uploading → Extracting → Validating → Indexing` vocabulary
        from actual Core stages only. Events ride the frozen F10
        EventRecord field set; events are never the source of truth — the
        authoritative state endpoint is.
    MemoryScope:
      type: string
      description: >-
        The closed memory-scope register — user | workspace | session |
        policy-defined (the approved basis's four-value list, carried
        canonical at the 2026-11-08 publication act). A `Work` scope joins
        only after D-12 approval — DEFERRED per P1.2; no Work value exists
        in this register. Scope never silently broadens: the scope is
        stated at creation and carried on every read; a scope value renders
        only as the Core reports it — the UI never invents a scope name and
        never maps an unknown reported scope to a known one.
        Session-scoped items never silently persist beyond the Core's
        session semantics.
    MemoryOrigin:
      type: string
      description: >-
        The closed memory-origin register — user-entered |
        approved-decision | imported | model-extracted (the approved
        basis's four-value list). An item's origin is labeled honestly as
        the Core reports it, never relabeled silently; a user-created item
        is user-entered, never mislabeled; model-extracted origin can only
        be set by the Core's own extraction path — no client body ever
        claims it. Imported-origin items are untrusted data and cannot
        grant permissions (they ride the published UntrustedLabel
        register).
    MemoryItemLifecycleState:
      type: string
      description: >-
        The closed memory lifecycle-state register — captured | extracted
        | pending_review | approved | rejected | active | updated |
        expired | forgotten | deleted | outcome_unknown — the publication
        act's register for MB §7.5's pipeline (the Core/API owner owns the
        real registry). Every transition is Core-confirmed; the UI never
        advances a state optimistically and never derives a state from a
        timeout. Trust state is DISTINCT from pending-review: pending
        review is a lifecycle filter/state, NEVER a trust claim.
        `expired` is the retention/TTL outcome — expiry is DISTINCT from
        forgotten and deleted and never UI-computed. THE FORGET/DELETE
        OPEN DISCIPLINE: the forgotten and deleted entries are carried per
        the approved register draft — whether forget and delete name
        distinct Core semantics is Core-defined and OPEN (the CF-2 draft
        §3(d); UI §15.4 holds either way); no published text here asserts
        that two distinct operations exist. `outcome_unknown` is the S0–S4
        OUTCOME_UNKNOWN surface: a timeout or lost response is never proof
        of success, cancellation, or safe retry — reconcile by the
        item/operation ID through the authoritative reads.
    MemoryItem:
      type: object
      description: >-
        One durable memory item (the B2 family; the item-identity members
        per MB §7.5's field list, carried canonical at the 2026-11-08
        publication act). THE SECRETS LAW (BINDING): passwords, API keys,
        private keys, payment credentials, and other secrets are NEVER
        stored in Memory — secret-manager/key-store references only (MB
        §7.5; MB §12.2 law 3); no member of this schema carries a secret
        value and a reference renders as a reference. THE PROMOTION
        BOUNDARY: Memory stays separate from canonical KnowledgePack truth
        (UI §15.1; MB §7.5); promotion from Memory to KnowledgePack is a
        SEPARATE explicit reviewed operation, provenance-preserving, with
        a reversible link, and Memory deletion never auto-deletes
        KnowledgePack claims — the promotion operation is the recorded
        sibling gap (P4.2 §5; the CF-2 draft §3(j)) and is NOT part of
        this family: no promotion member exists here and none is invented.
        Memory content is sensitive personal/conversational data — never
        leaked into URLs, logs, or error messages; the UI never computes
        or infers a timestamp, a retention class, or a conflict warning:
        each renders only as the Core reports it (missing → Unavailable,
        never invented).
      required: [memory_item_id, scope, origin, lifecycle_state, content, created_at, updated_at]
      properties:
        memory_item_id: { type: string, description: The Core-owned stable identity; the UI never mints, guesses, or rewrites it. }
        scope: { $ref: '#/components/schemas/MemoryScope' }
        origin: { $ref: '#/components/schemas/MemoryOrigin' }
        lifecycle_state: { $ref: '#/components/schemas/MemoryItemLifecycleState' }
        content: { type: string }
        creation_method: { type: string, description: The creation method where the Core carries it (model + version where relevant); absent = the Core supplies none — rendered Unavailable, never invented. }
        confidence: { type: string, description: The Core-reported confidence/status where the Core carries it; absent = Unavailable, never invented. }
        originating_refs:
          type: array
          description: The originating references — the source event shown, never rewritten; provenance is never silently rewritten by an edit (UI §15.5).
          items: { type: string }
        retention_ttl_ref: { type: string, description: The Core's retention/TTL class reference; expiry is DISTINCT from forgotten and deleted and never UI-computed. }
        conflict_note: { type: string, description: The correction/conflict path's Core-returned conflict/freshness warning — rendered only as returned, never invented; empty = none reported. }
        untrusted_label: { $ref: '#/components/schemas/UntrustedLabel' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, description: The Core-reported last-used timestamp where the Core carries one. }
        last_confirmed_at: { type: string, format: date-time, description: The Core-reported last-confirmed timestamp where the Core carries one. }
        updated_at: { type: string, format: date-time }
    MemoryItemList:
      type: object
      description: One bounded memory-items page (the keyset list semantics).
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryItem' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    MemoryAddRequest:
      type: object
      description: >-
        The add body — the M-17 creation identity, the stated scope, the
        honest origin, and the content; the Core mints the memory_item_id
        and the body never carries one. THE SECRETS LAW (BINDING): a body
        attempting secret storage is refused (MEMORY_SECRETS_REJECTED) —
        secrets are never stored in Memory; secret-manager/key-store
        references only.
      required: [idempotency_key, correlation_id, scope, origin, content]
      properties:
        idempotency_key: { type: string, description: The M-17 idempotency key — scoped user + scope (+ session where session-scoped) Core-side; its fingerprint is the request identity. }
        correlation_id: { type: string, description: The request identity — the fingerprint the selected replay window keys on (72 h post-terminal; the F6-precedent window, selected at this act per the CF-2 draft's offered candidate). }
        scope: { $ref: '#/components/schemas/MemoryScope' }
        origin: { $ref: '#/components/schemas/MemoryOrigin' }
        content: { type: string }
        originating_refs:
          type: array
          description: The caller-supplied originating references where the add carries them.
          items: { type: string }
    MemoryEditRequest:
      type: object
      description: >-
        The edit/correct body — the corrected content prepared against the
        item's current state reference (the M-16 fingerprint's state
        half). Provenance-preserving: the edit never rewrites the origin
        label or the originating references, and the edit alone never
        constitutes review approval.
      required: [idempotency_key, correlation_id, item_state_ref, content]
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. }
        correlation_id: { type: string, description: The operation's correlation ID — the fingerprint's first half. }
        item_state_ref: { type: string, description: The item's current state reference the edit was prepared against — the fingerprint's second half; a mismatch is 409 MEMORY_CONFLICT (reconcile by re-reading the item's authoritative state, never overwrite). }
        content: { type: string, description: The corrected content. }
    MemoryReviewRequest:
      type: object
      description: The review-action body (the approve and reject members) — the explicit user action's identity; the item identity rides the path.
      required: [idempotency_key, correlation_id]
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. }
        correlation_id: { type: string, description: The operation's correlation ID — the fingerprint's first half (the second half is the item's current state reference, Core-resolved). }
    MemoryPinRequest:
      type: object
      description: The pin/unpin member's body — one member operation covering both directions.
      required: [idempotency_key, correlation_id, pinned]
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. }
        correlation_id: { type: string, description: The operation's correlation ID. }
        pinned: { type: boolean, description: true pins; false unpins. }
    MemoryInclusionRequest:
      type: object
      description: >-
        The per-request-inclusion member's body — the M-18 request-scoped
        decision. It applies ONLY to the stated request/scope and never
        changes the item's lifecycle state or any other scope.
      required: [correlation_id, request_ref, included]
      properties:
        correlation_id: { type: string, description: The request's correlation ID — the fingerprint's first half. }
        request_ref: { type: string, description: The stated request/scope reference — the ONLY scope this decision applies to (the key scope is the stated request/scope ONLY; retention request-lifetime at most). }
        included: { type: boolean, description: Whether the item is included for the stated request. }
    MemoryInclusionResult:
      type: object
      description: The per-request-inclusion member's Core-confirmed outcome — a decision record, not an item-state change.
      required: [memory_item_id, request_ref, included, operation_id]
      properties:
        memory_item_id: { type: string }
        request_ref: { type: string }
        included: { type: boolean }
        operation_id: { type: string, description: The operation reference a lost response reconciles through (the S0–S4 law). }
    MemoryExportRequest:
      type: object
      description: >-
        The export member's body — the exact export scope, shown before
        generation, never assumed. SECRETS ARE EXCLUDED BY DEFAULT (a
        prohibition, not a preference): no secret value ever enters an
        export artifact.
      required: [correlation_id, scope]
      properties:
        correlation_id: { type: string, description: The export's request identity — the identity an uncertain export reconciles through before another copy (the S0–S4 law). }
        scope: { $ref: '#/components/schemas/MemoryScope' }
        item_ids:
          type: array
          description: The explicit item subset where the export names one; absent = the scope's items the Core serves.
          items: { type: string }
        destination: { type: string, description: The destination descriptor where the export carries one — displayed before generation, never assumed. }
    MemoryExportResult:
      type: object
      description: The export document — a read-with-output (no item-state change); the honest count, the generation instant, and the honest truncation flag.
      required: [export_operation_id, count, generated_at, truncated, items]
      properties:
        export_operation_id: { type: string, description: The export operation's identity — an uncertain export reconciles through it before another copy (the S0–S4 law). }
        count: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }
        truncated: { type: boolean, description: A range exceeding the finite bound truncates honestly — never silently. }
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryItem' }
    MemoryMutationResult:
      type: object
      description: >-
        One state-confirmed Memory mutation's outcome (the add, edit,
        approve, reject, pin/unpin, and forget members) — the
        Core-confirmed post-state item and the operation reference. Only a
        confirmed 200 carries the outcome truth (the F11 law); the request
        is never displayed as the confirmation (the J-5 rule). The
        operation_id is the reconciliation identity for a lost response
        (the S0–S4 law): reconcile through the operation-status read or
        the item's inspect read BEFORE any retry — never a blind re-issue.
      required: [memory_item, operation_id]
      properties:
        memory_item: { $ref: '#/components/schemas/MemoryItem' }
        operation_id: { type: string, description: The Core-minted operation reference — the reconcile-by-operation-ID identity. }
    MemoryDeleteResult:
      type: object
      description: >-
        The delete member's Core-confirmed outcome — the deletion truth
        and the retention caveat the Core confirms, never a
        total-erasure promise: the retained scope (derived references,
        sync state, backup retention as policy defines) is the
        Core-confirmed statement's. Memory deletion never auto-deletes
        KnowledgePack claims (MB §7.5).
      required: [memory_item_id, outcome_state, operation_id]
      properties:
        memory_item_id: { type: string }
        outcome_state: { $ref: '#/components/schemas/MemoryItemLifecycleState' }
        retention_note: { type: string, description: The Core-confirmed retention caveat where the Core carries one — empty = none reported. }
        operation_id: { type: string, description: The Core-minted operation reference — the reconcile-by-operation-ID identity (a lost destructive response is never assumed to have destroyed). }
    MemoryOperationKind:
      type: string
      description: >-
        The closed memory-operation kind register — add | edit | approve |
        reject | pin | unpin | forget | delete | export | inclusion (the
        operation rows the operation-status endpoint resolves; the
        list/query and inspect reads are correlation-class reads with no
        operation row).
    MemoryOperationState:
      type: string
      description: >-
        The closed memory-operation state register — recorded |
        outcome_unknown. `recorded` carries the Core-confirmed outcome in
        the record's result members; `outcome_unknown` is the S0–S4
        OUTCOME_UNKNOWN surface — a timeout or lost response is never
        proof of success, cancellation, or safe retry; reconcile by the
        operation ID through the operation-status read (or by the item
        identity through the inspect read) BEFORE any retry. A failure is
        a recorded, confirmed outcome — its coded failure rides
        failure_code/failure_reason.
    MemoryOperation:
      type: object
      description: One memory operation's authoritative record — the operation-status endpoint's payload (the S0–S4 unknown-outcome lookup's operation-ID half).
      required: [operation_id, kind, state, created_at, updated_at]
      properties:
        operation_id: { type: string, description: The Core-minted operation reference. }
        kind: { $ref: '#/components/schemas/MemoryOperationKind' }
        state: { $ref: '#/components/schemas/MemoryOperationState' }
        correlation_id: { type: string, description: The operation's correlation ID. }
        memory_item_id: { type: string, description: The item the operation acted on, where one exists. }
        outcome_state: { $ref: '#/components/schemas/MemoryItemLifecycleState' }
        export_ref: { type: string, description: The export artifact's reference where the kind is export. }
        failure_code: { type: string, description: The coded failure (the family's register codes) where the confirmed outcome is a failure; empty otherwise. }
        failure_reason: { type: string, description: The Core-supplied explicit reason — the honest statement, never a suppressed warning. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryErrorCode:
      type: string
      description: >-
        The Memory family's domain codes added to the coded error register
        (F1) additively at the 2026-11-08 publication act — each riding
        the published ErrorEnvelope with its retryable value and the coded
        retryClass. MEMORY_SCOPE_VIOLATION (never — a read/write crossing
        the forbidden cross-scope default; MB §7.5),
        MEMORY_SECRETS_REJECTED (never — a write attempting secret
        storage; the BINDING secrets law, MB §12.2 law 3),
        MEMORY_ITEM_NOT_FOUND (never — the unknown or out-of-scope item,
        the SAME typed 404 — the no-leak rule),
        MEMORY_REVIEW_STATE_CONFLICT (never — approve/reject against an
        item not in the required review state), MEMORY_CONFLICT (reconcile
        — the correction/conflict path's concurrent-edit outcome; reconcile
        by re-reading the item's authoritative state, never overwrite),
        MEMORY_NOT_EDITABLE (never — the eligibility law's refusal; the
        Core owns eligibility). The idempotency/state conflicts ride the
        PUBLISHED codes exactly — CONFLICT_IDEMPOTENCY_KEY (same key +
        different body) and CONFLICT_STATE (replay past the window).
    MemoryEventAggregateType:
      type: string
      description: The Memory family's F10 aggregate types — memoryItem | memoryReviewOperation.
    MemoryEventType:
      type: string
      description: >-
        The Memory family's F10 event_type vocabulary —
        memory_candidate.extracted | memory_item.added |
        memory_review.approved | memory_review.rejected |
        memory_item.updated | memory_item.pinned | memory_item.unpinned |
        memory_item.expired | memory_item.forgotten | memory_item.deleted.
        `memory_item.forgotten` is recorded conditional on the OPEN
        forget/delete distinctness — whether a forgotten event exists as
        distinct from deleted is the Core's semantics (carried OPEN; no
        published text asserts two distinct operations exist).
        `memory_candidate.extracted` is the sensitivity check's routing
        event (auto-save low-risk vs approval-required). Events ride the
        frozen F10 EventRecord field set with the C1-08 cursor semantics
        (opaque, stream/workspace-scoped, authorization-checked cursors;
        dedup by event_id; reconcile by the per-aggregate monotonic
        sequence; at-least-once delivery); events are never the source of
        truth — the authoritative state reads are.
