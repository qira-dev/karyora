    Conversation:
      type: object
      description: The durable conversation aggregate's identity members (F4; P-S5-01) — the Core-issued stable identity; the title is display-only; updated_at advances when the aggregate's messages advance (the list's Core-defined sort key).
      required: [conversation_id, title, created_at, updated_at]
      properties:
        conversation_id: { type: string }
        title: { type: string, description: The optional bounded display title — an untitled conversation renders its own identity; no rename operation exists. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MessageRole:
      type: string
      description: The closed coded per-message role register — `user` (the only coded value; the answering/assistant role joins additively at its producer milestone, never before — the v1 Ask surface IS record-only per the O-a resolution of 2026-11-07, and a future answer binds as a `Message` row of this register per the B1 class-level resolution).
    Message:
      type: object
      description: One authoritative conversation message (F4; P-S5-02) — a stable per-message identity, the intra-conversation ordering key, and the correlation-ID linkage to the send that produced it; safe metadata only.
      required: [message_id, conversation_id, seq, role, content, created_at]
      properties:
        message_id: { type: string }
        conversation_id: { type: string }
        seq: { type: integer, description: The 1-based intra-conversation ordering key — monotonic within one conversation, the timeline's authoritative order. }
        role: { $ref: '#/components/schemas/MessageRole' }
        content: { type: string }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
    ExchangeState:
      type: string
      description: The closed coded exchange-state register — `recorded` (the only coded value; the answering/stream states join additively with their producer — no value is invented for a producer that does not exist).
    Exchange:
      type: object
      description: The send's durable linkage row (F4; P-S5-05) — the correlation ID is PRIMARY (the identity the S4 query-before-retry read resolves through); it is NOT an idempotency key — the coded Open class resolved canonical (the C1 resolution of 2026-11-07).
      required: [correlation_id, conversation_id, user_message_id, state, created_at]
      properties:
        correlation_id: { type: string }
        conversation_id: { type: string }
        user_message_id: { type: string }
        state: { $ref: '#/components/schemas/ExchangeState' }
        created_at: { type: string, format: date-time }
    ConversationCreateRequest:
      type: object
      description: The create body — the optional bounded display title is the only member; the Core mints the identity.
      properties:
        title: { type: string }
    ConversationSendRequest:
      type: object
      description: The send body — the message content and the correlation_id request identity (S4; never an idempotency key).
      required: [content, correlation_id]
      properties:
        content: { type: string }
        correlation_id: { type: string }
    ConversationExchangeResult:
      type: object
      description: The send's (and the S4 read's) outcome — the durable exchange linkage and the persisted user message.
      required: [exchange, message]
      properties:
        exchange: { $ref: '#/components/schemas/Exchange' }
        message: { $ref: '#/components/schemas/Message' }
    ConversationList:
      type: object
      description: One bounded conversations page (the keyset list semantics; an empty page IS the honest no-match answer).
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    ConversationMessages:
      type: object
      description: One bounded messages page (timeline order — the 1-based per-conversation Seq ascending).
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    KnowledgePack:
      type: object
      description: >-
        One durable knowledge pack (the B1 family; the CF-1 publication act
        of 2026-11-07). The pack's identity members and its
        current-version reference; the `.kpack` unit's manifest / claims /
        evidence / sources / relations / summaries / policies / signatures
        / indexes structure owns the content — indexes are rebuildable,
        never canonical.
      required: [pack_id, schema_version, title, created_at, updated_at, current_version_id]
      properties:
        pack_id: { type: string, description: 'The Core-owned stable pack identifier; the consumer-side reference form packID or packID@version resolves against it.' }
        schema_version: { type: integer, description: 'The pack schema''s own version field, carried alongside the pack identity.' }
        title: { type: string, description: 'The display title — a label, never a path.' }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_version_id: { type: string, description: 'The pack''s current version''s identity; empty = no version stored yet.' }
    KnowledgePackList:
      type: object
      description: One bounded knowledge-pack page (the keyset list semantics).
      required: [packs]
      properties:
        packs:
          type: array
          items: { $ref: '#/components/schemas/KnowledgePack' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    KnowledgePackVersion:
      type: object
      description: >-
        One immutable pack version (the B1 family): the Core-owned identity,
        the immutable content root, and the explicit supersession
        references. Prior versions are immutable — a source-snapshot change
        creates a new version or an explicit supersession, never edits old
        evidence; immutability is Core-enforced.
      required: [pack_id, version_id, schema_version, pack_root_digest, created_at]
      properties:
        pack_id: { type: string }
        version_id: { type: string, description: 'The Core-owned immutable content root''s identity.' }
        schema_version: { type: integer }
        pack_root_digest:
          type: string
          description: >-
            The version's pack-root digest over the normalized,
            deterministically ordered entry paths, media types and blob
            digests. The algorithm-qualified digest form
            `sha256:<lowercase-hex>` is carried as a value format for
            description only — the D-41 portable digest profile stays behind
            its owner technical/security gate; this contract does not
            approve SHA-256 or any algorithm as the permanent digest
            profile. A digest establishes content identity relative to
            compared bytes only — never publisher authorization,
            authenticity, license compliance, factual truth, or freedom
            from prompt injection.
        entry_count: { type: integer, minimum: 0 }
        claim_count: { type: integer, minimum: 0 }
        evidence_count: { type: integer, minimum: 0 }
        supersedes:
          type: array
          description: The explicit supersession references this version declares.
          items: { type: string }
        superseded_by: { type: string, description: 'The version that explicitly supersedes this one; empty = none.' }
        license: { type: string, description: 'The license metadata — SPDX identifier/expression where applicable.' }
        license_status: { type: string, description: 'known | unknown (the Core-assessed status; unknown renders honestly, never as a license claim).' }
        claims:
          type: array
          description: The version's claims where the Core serves them (the structural read's optional members).
          items: { $ref: '#/components/schemas/KnowledgeClaim' }
        evidence:
          type: array
          description: The version's evidence where the Core serves them.
          items: { $ref: '#/components/schemas/KnowledgeEvidence' }
    KnowledgePackVersionList:
      type: object
      description: One bounded pack-version page (the keyset list semantics).
      required: [versions]
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/KnowledgePackVersion' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    KnowledgeClaimStatus:
      type: string
      description: >-
        The closed claim-status register — candidate | active | contested |
        superseded | revoked | archived (the approved basis's six-value
        list). Conflicting claims are never hidden — shown via the explicit
        relations.
    KnowledgeClaim:
      type: object
      description: One knowledge claim (MB §6.3's model carried).
      required: [claim_id, subject, predicate, object, scope, status]
      properties:
        claim_id: { type: string }
        subject: { type: string }
        predicate: { type: string }
        object: { type: string }
        scope: { type: string }
        status: { $ref: '#/components/schemas/KnowledgeClaimStatus' }
        valid_from: { type: string, format: date-time, description: 'The claim''s valid time.' }
        valid_until: { type: string, format: date-time }
        observed_at: { type: string, format: date-time, description: 'The observed time.' }
        source_refs:
          type: array
          items: { type: string }
        evidence_refs:
          type: array
          items: { type: string }
        derived_from:
          type: array
          items: { type: string }
        supersedes:
          type: array
          items: { type: string }
        conflicts_with:
          type: array
          description: The explicit conflict relations — conflicts are surfaced, never suppressed (the MB §6.3 explicit-failure law).
          items: { type: string }
        language: { type: string }
        validation_note: { type: string, description: 'The validation metadata where the Core carries it.' }
    KnowledgeEvidenceVerificationState:
      type: string
      description: >-
        The closed evidence verification-state register — unsigned |
        verified | revoked | quarantined (the Core's implemented
        trust-state register carried canonical at this act). A verified
        state is content-identity evidence only — never publisher
        authorization, authenticity, license compliance, factual truth, or
        freedom from prompt injection; a signature is not safety or
        authenticity.
    KnowledgeEvidence:
      type: object
      description: One evidence record (MB §6.3's model carried).
      required: [evidence_id, source_id, locator, captured_at, verification_state]
      properties:
        evidence_id: { type: string }
        source_id: { type: string }
        locator: { type: string, description: 'The source locator — a reference, never a rendered path.' }
        digest:
          type: string
          description: >-
            The excerpt/content digest. The algorithm-qualified digest form
            `sha256:<lowercase-hex>` is carried as a value format for
            description only — the D-41 portable digest profile stays behind
            its owner technical/security gate; this contract does not
            approve SHA-256 or any algorithm as the permanent digest
            profile.
        source_snapshot_ref: { type: string, description: 'The optional source-snapshot reference.' }
        captured_at: { type: string, format: date-time }
        verification_state: { $ref: '#/components/schemas/KnowledgeEvidenceVerificationState' }
    KnowledgePackSource:
      type: object
      description: One source identity (the locator, the capture metadata, and the license/freshness members).
      required: [source_id, kind, locator, captured_at]
      properties:
        source_id: { type: string }
        kind: { type: string, description: 'The Core-supported source kind — the import registry read is the definitive list; never a client-invented value.' }
        locator: { type: string }
        captured_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time, description: 'The observed time where the Core carries one.' }
        license: { type: string, description: 'SPDX identifier/expression where applicable.' }
        license_status: { type: string, description: 'known | unknown.' }
        freshness_policy_ref: { type: string, description: 'The freshness policy reference.' }
    KnowledgeImportSourceSpec:
      type: object
      description: One served supported-source registry member — the Core's own supported kinds and per-kind size bounds as queryable contract data.
      required: [source_kind, max_bytes]
      properties:
        source_kind: { type: string }
        max_bytes: { type: integer, format: int64 }
        url_policy: { type: string, description: 'The URL policy statement where the kind fetches URLs (SSRF/DNS-rebinding/redirect policy; redirect limits; response size/time bounds).' }
        notes: { type: string }
    KnowledgeImportRequest:
      type: object
      description: >-
        The import submit body — the identity key, the display source name,
        a registry source kind, the base64 (standard, padded) content, and
        the destination/duplicate intents. The content rides the JSON
        envelope transport (the F4 attachment class's transport typing).
      required: [idempotency_key, source_name, source_kind, content_b64]
      properties:
        idempotency_key: { type: string, description: 'The M-9 idempotency key — the key whose duplicate behavior is digest-keyed.' }
        source_name: { type: string, description: 'The display source name — a label, never a path.' }
        source_kind: { type: string, description: 'One registry source kind — the registry read''s values; never a client-invented kind.' }
        content_b64: { type: string, description: 'The base64 (standard, padded) submitted bytes.' }
        destination_pack_id:
          type: string
          description: >-
            Present = the version-create identity operation on the named
            pack; absent = the pack-create identity operation (distinct
            identity operations — MB §6.2). The identity-create idempotency
            fingerprint is the request identity + the target pack/version
            identity; its replay window is the selected short window — 1 h
            post-terminal (selected at the 2026-11-07 publication act):
            within it a re-issued same-intent create returns the existing
            pack/version reference; past it a repeated create intent is the
            caller's explicit new operation.
        duplicate_mode: { $ref: '#/components/schemas/KnowledgeImportDuplicateMode' }
        external_transfer_confirmed:
          type: boolean
          description: >-
            The explicit pre-submit confirmation for the external-transfer
            boundary (a provider/remote-Core crossing; UI §24.4) — present
            only where the destination crosses it. A Remote Core cannot
            interpret the user's local localhost path/endpoint as its own
            local resource.
    KnowledgeImportDuplicateMode:
      type: string
      description: >-
        The Core-exposed digest-match choices — logical_reference |
        deduplication | distinct_reference. Displayed and accepted ONLY
        where the Core defines the corresponding operation; the original
        pack/version stays visible until the new operation confirms.
    KnowledgeExportRequest:
      type: object
      description: The export request body — the exact scope and the destination shown before generation.
      required: [correlation_id, pack_id, destination]
      properties:
        correlation_id: { type: string, description: 'The request identity (the read-with-output class''s correlation; safe re-issue).' }
        pack_id: { type: string }
        version_id: { type: string, description: 'The exact version to export; absent = the pack''s current version.' }
        destination: { type: string, description: 'The destination descriptor — displayed before generation, never assumed.' }
        external_transfer_confirmed:
          type: boolean
          description: The explicit pre-submit confirmation for the external-transfer boundary (UI §24.4).
    KnowledgeOperationKind:
      type: string
      description: The closed knowledge-operation kind register — import | export.
    KnowledgeOperationState:
      type: string
      description: >-
        The closed knowledge-operation state register — submitted |
        uploading | extracting | validating | indexing | generating |
        completed | rejected | failed | cancelled | outcome_unknown. The
        import stage vocabulary `Uploading → Extracting → Validating →
        Indexing` (UI §14.4) is emitted from ACTUAL Core stages only as
        F10-shaped events (`import.stage_entered`) — progress is never a
        fabricated percentage and no percentage member exists. `rejected`
        and `failed` carry the explicit failure code and reason (the
        MB §6.3 explicit-failure list: dependency cycle, invalid signature,
        unsupported schema, revoked trust, digest mismatch, license-policy
        failure each produce an EXPLICIT failure or quarantine — never a
        suppressed warning). `cancelled` is Core-confirmed only.
        `outcome_unknown` is the S0–S4 OUTCOME_UNKNOWN surface: a timeout
        or lost response is never proof of success, cancellation, or safe
        retry — reconcile by the operation ID through the authoritative
        state read.
    KnowledgeOperation:
      type: object
      description: One knowledge operation's authoritative record (import or export) — the state endpoint's payload.
      required: [operation_id, kind, state, correlation_id, created_at, updated_at]
      properties:
        operation_id: { type: string }
        kind: { $ref: '#/components/schemas/KnowledgeOperationKind' }
        state: { $ref: '#/components/schemas/KnowledgeOperationState' }
        correlation_id: { type: string, description: 'The operation''s correlation ID — the identity a lost response reconciles through.' }
        failure_code: { type: string, description: 'The coded failure (the family''s register codes) on rejected/failed; empty otherwise.' }
        failure_reason: { type: string, description: 'The Core-supplied explicit reason — the honest statement, never a suppressed warning.' }
        result: { $ref: '#/components/schemas/KnowledgeOperationResult' }
        untrusted_label: { $ref: '#/components/schemas/UntrustedLabel' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KnowledgeOperationResult:
      type: object
      description: >-
        One operation's Core-confirmed result — what persists (artifact,
        pack-version reference, derived indexes) and what the retention
        policy applies; no erasure claim beyond Core-confirmed scope.
        Present only once the operation carries it.
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/KnowledgeOperationKind' }
        pack_id: { type: string, description: 'The import''s pack-version reference''s pack identity.' }
        version_id: { type: string, description: 'The import''s pack-version reference''s version identity.' }
        export_ref: { type: string, description: 'The export artifact''s reference.' }
        digest:
          type: string
          description: >-
            The produced bytes' digest where one is produced. The
            algorithm-qualified digest form `sha256:<lowercase-hex>` is
            carried as a value format for description only — the D-41
            portable digest profile stays behind its owner
            technical/security gate; this contract does not approve SHA-256
            or any algorithm as the permanent digest profile.
    KnowledgeOperationSubmitResult:
      type: object
      description: One submit's accepted outcome — the operation reference (replayed=true on the M-9 same-digest replay).
      required: [operation, replayed]
      properties:
        operation: { $ref: '#/components/schemas/KnowledgeOperation' }
        replayed: { type: boolean }
    KnowledgeErrorCode:
      type: string
      description: >-
        The KnowledgePack family's domain codes added to the coded error
        register (F1) additively at the 2026-11-07 publication act — each
        riding the published ErrorEnvelope with its retryable value and the
        coded retryClass. The MB §6.3 explicit-failure list:
        KNOWLEDGE_DEPENDENCY_CYCLE, KNOWLEDGE_SIGNATURE_INVALID,
        KNOWLEDGE_SCHEMA_UNSUPPORTED, KNOWLEDGE_TRUST_REVOKED,
        KNOWLEDGE_DIGEST_MISMATCH, KNOWLEDGE_LICENSE_POLICY_FAIL (each
        never — explicit failures never retry). The import rejection
        vocabulary: IMPORT_TYPE_UNSUPPORTED, IMPORT_SIZE_OVER_LIMIT,
        IMPORT_MALFORMED, IMPORT_DUPLICATE_DIGEST,
        IMPORT_PERMISSION_DENIED, IMPORT_POLICY_BLOCKED,
        IMPORT_INTEGRITY_SIGNATURE_FAILURE (each never),
        IMPORT_NETWORK_INTERRUPTED (backoff — transient network). The
        idempotency/state conflicts ride the PUBLISHED codes exactly —
        CONFLICT_IDEMPOTENCY_KEY (same key + different bytes; the M-9
        fingerprintMatch:false datum in data) and CONFLICT_STATE (replay
        past the window).
    KnowledgeEventAggregateType:
      type: string
      description: >-
        The KnowledgePack family's F10 aggregate types — knowledgePack |
        knowledgePackVersion | knowledgeImportOperation |
        knowledgeExportOperation.
    KnowledgeEventType:
      type: string
      description: >-
        The KnowledgePack family's F10 event_type vocabulary —
        pack.created | pack_version.created | pack_version.superseded |
        import.submitted | import.stage_entered | import.completed |
        import.rejected | import.cancelled | export.submitted |
        export.completed | export.failed. `import.stage_entered` carries
        the `Uploading → Extracting → Validating → Indexing` vocabulary
        from actual Core stages only. Events ride the frozen F10
        EventRecord field set; events are never the source of truth — the
        authoritative state endpoint is.
    MemoryScope:
      type: string
      description: >-
        The closed memory-scope register — user | workspace | session |
        policy-defined (the approved basis's four-value list, carried
        canonical at the 2026-11-08 publication act). A `Work` scope joins
        only after D-12 approval — DEFERRED per P1.2; no Work value exists
        in this register. Scope never silently broadens: the scope is
        stated at creation and carried on every read; a scope value renders
        only as the Core reports it — the UI never invents a scope name and
        never maps an unknown reported scope to a known one.
        Session-scoped items never silently persist beyond the Core's
        session semantics.
    MemoryOrigin:
      type: string
      description: >-
        The closed memory-origin register — user-entered |
        approved-decision | imported | model-extracted (the approved
        basis's four-value list). An item's origin is labeled honestly as
        the Core reports it, never relabeled silently; a user-created item
        is user-entered, never mislabeled; model-extracted origin can only
        be set by the Core's own extraction path — no client body ever
        claims it. Imported-origin items are untrusted data and cannot
        grant permissions (they ride the published UntrustedLabel
        register).
    MemoryItemLifecycleState:
      type: string
      description: >-
        The closed memory lifecycle-state register — captured | extracted
        | pending_review | approved | rejected | active | updated |
        expired | forgotten | deleted | outcome_unknown — the publication
        act's register for MB §7.5's pipeline (the Core/API owner owns the
        real registry). Every transition is Core-confirmed; the UI never
        advances a state optimistically and never derives a state from a
        timeout. Trust state is DISTINCT from pending-review: pending
        review is a lifecycle filter/state, NEVER a trust claim.
        `expired` is the retention/TTL outcome — expiry is DISTINCT from
        forgotten and deleted and never UI-computed. THE FORGET/DELETE
        DISTINCTNESS (recorded at the 2026-11-09 resolution act, binding
        on this family): forget and delete are DISTINCT Core semantics at
        the register level — the forgotten and deleted entries are the two
        DISTINCT lifecycle states (the forgotten state; the deleted
        state), each confirmed by its own event (memory_item.forgotten;
        memory_item.deleted) — both riding the SAME M-16 removal
        discipline (the content dropped; the identity tombstone retains
        identity/scope/state; the retention caveat identical;
        no immediate-total-erasure promise). `outcome_unknown` is the S0–S4
        OUTCOME_UNKNOWN surface: a timeout or lost response is never proof
        of success, cancellation, or safe retry — reconcile by the
        item/operation ID through the authoritative reads.
    MemoryItem:
      type: object
      description: >-
        One durable memory item (the B2 family; the item-identity members
        per MB §7.5's field list, carried canonical at the 2026-11-08
        publication act). THE SECRETS LAW (BINDING): passwords, API keys,
        private keys, payment credentials, and other secrets are NEVER
        stored in Memory — secret-manager/key-store references only (MB
        §7.5; MB §12.2 law 3); no member of this schema carries a secret
        value and a reference renders as a reference. THE PROMOTION
        BOUNDARY: Memory stays separate from canonical KnowledgePack truth
        (UI §15.1; MB §7.5); promotion from Memory to KnowledgePack is a
        SEPARATE explicit reviewed operation, provenance-preserving, with
        a reversible link, and Memory deletion never auto-deletes
        KnowledgePack claims — the promotion operation is the recorded
        sibling gap (P4.2 §5; the CF-2 draft §3(j)) and is NOT part of
        this family: no promotion member exists here and none is invented.
        Memory content is sensitive personal/conversational data — never
        leaked into URLs, logs, or error messages; the UI never computes
        or infers a timestamp, a retention class, or a conflict warning:
        each renders only as the Core reports it (missing → Unavailable,
        never invented).
      required: [memory_item_id, scope, origin, lifecycle_state, content, created_at, updated_at]
      properties:
        memory_item_id: { type: string, description: The Core-owned stable identity; the UI never mints, guesses, or rewrites it. }
        scope: { $ref: '#/components/schemas/MemoryScope' }
        origin: { $ref: '#/components/schemas/MemoryOrigin' }
        lifecycle_state: { $ref: '#/components/schemas/MemoryItemLifecycleState' }
        content: { type: string }
        creation_method: { type: string, description: The creation method where the Core carries it (model + version where relevant); absent = the Core supplies none — rendered Unavailable, never invented. }
        confidence: { type: string, description: The Core-reported confidence/status where the Core carries it; absent = Unavailable, never invented. }
        originating_refs:
          type: array
          description: The originating references — the source event shown, never rewritten; provenance is never silently rewritten by an edit (UI §15.5).
          items: { type: string }
        retention_ttl_ref: { type: string, description: The Core's retention/TTL class reference; expiry is DISTINCT from forgotten and deleted and never UI-computed. }
        conflict_note: { type: string, description: The correction/conflict path's Core-returned conflict/freshness warning — rendered only as returned, never invented; empty = none reported. }
        untrusted_label: { $ref: '#/components/schemas/UntrustedLabel' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, description: The Core-reported last-used timestamp where the Core carries one. }
        last_confirmed_at: { type: string, format: date-time, description: The Core-reported last-confirmed timestamp where the Core carries one. }
        updated_at: { type: string, format: date-time }
    MemoryItemList:
      type: object
      description: One bounded memory-items page (the keyset list semantics).
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryItem' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    MemoryAddRequest:
      type: object
      description: >-
        The add body — the M-17 creation identity, the stated scope, the
        honest origin, and the content; the Core mints the memory_item_id
        and the body never carries one. THE SECRETS LAW (BINDING): a body
        attempting secret storage is refused (MEMORY_SECRETS_REJECTED) —
        secrets are never stored in Memory; secret-manager/key-store
        references only.
      required: [idempotency_key, correlation_id, scope, origin, content]
      properties:
        idempotency_key: { type: string, description: The M-17 idempotency key — scoped user + scope (+ session where session-scoped) Core-side; its fingerprint is the request identity. }
        correlation_id: { type: string, description: The request identity — the fingerprint the selected replay window keys on (72 h post-terminal; the F6-precedent window, selected at this act per the CF-2 draft's offered candidate). }
        scope: { $ref: '#/components/schemas/MemoryScope' }
        origin: { $ref: '#/components/schemas/MemoryOrigin' }
        content: { type: string }
        originating_refs:
          type: array
          description: The caller-supplied originating references where the add carries them.
          items: { type: string }
    MemoryEditRequest:
      type: object
      description: >-
        The edit/correct body — the corrected content prepared against the
        item's current state reference (the M-16 fingerprint's state
        half). Provenance-preserving: the edit never rewrites the origin
        label or the originating references, and the edit alone never
        constitutes review approval.
      required: [idempotency_key, correlation_id, item_state_ref, content]
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. }
        correlation_id: { type: string, description: The operation's correlation ID — the fingerprint's first half. }
        item_state_ref: { type: string, description: The item's current state reference the edit was prepared against — the fingerprint's second half; a mismatch is 409 MEMORY_CONFLICT (reconcile by re-reading the item's authoritative state, never overwrite). }
        content: { type: string, description: The corrected content. }
    MemoryDestructiveRequest:
      type: object
      description: >-
        The delete and forget members' OPTIONAL keying body — the M-16
        keying carrier whose members are both OPTIONAL (no required array):
        the keyed form replays the recorded outcome within the 1 h
        post-terminal window; an empty body is the unkeyed record — a
        non-replayable destructive operation whose reconciliation rides the
        response's operation ID through the state endpoint (the S0–S4 law).
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. OPTIONAL — omitting it together with the correlation_id records the unkeyed destructive operation. }
        correlation_id: { type: string, description: The operation's correlation ID — the fingerprint's first half (the second half is the item's current state reference — Core-resolved). OPTIONAL alongside the idempotency_key. }
    MemoryReviewRequest:
      type: object
      description: The review-action body (the approve and reject members) — the explicit user action's identity; the item identity rides the path.
      required: [idempotency_key, correlation_id]
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. }
        correlation_id: { type: string, description: The operation's correlation ID — the fingerprint's first half (the second half is the item's current state reference, Core-resolved). }
    MemoryPinRequest:
      type: object
      description: The pin/unpin member's body — one member operation covering both directions.
      required: [idempotency_key, correlation_id, pinned]
      properties:
        idempotency_key: { type: string, description: The M-16 idempotency key — scoped user + item identity + scope Core-side. }
        correlation_id: { type: string, description: The operation's correlation ID. }
        pinned: { type: boolean, description: true pins; false unpins. }
    MemoryInclusionRequest:
      type: object
      description: >-
        The per-request-inclusion member's body — the M-18 request-scoped
        decision. It applies ONLY to the stated request/scope and never
        changes the item's lifecycle state or any other scope.
      required: [correlation_id, request_ref, included]
      properties:
        correlation_id: { type: string, description: The request's correlation ID — the fingerprint's first half. }
        request_ref: { type: string, description: The stated request/scope reference — the ONLY scope this decision applies to (the key scope is the stated request/scope ONLY; retention request-lifetime at most). }
        included: { type: boolean, description: Whether the item is included for the stated request. }
    MemoryInclusionResult:
      type: object
      description: The per-request-inclusion member's Core-confirmed outcome — a decision record, not an item-state change.
      required: [memory_item_id, request_ref, included, operation_id]
      properties:
        memory_item_id: { type: string }
        request_ref: { type: string }
        included: { type: boolean }
        operation_id: { type: string, description: The operation reference a lost response reconciles through (the S0–S4 law). }
    MemoryExportRequest:
      type: object
      description: >-
        The export member's body — the exact export scope, shown before
        generation, never assumed. SECRETS ARE EXCLUDED BY DEFAULT (a
        prohibition, not a preference): no secret value ever enters an
        export artifact.
      required: [correlation_id, scope]
      properties:
        correlation_id: { type: string, description: The export's request identity — the identity an uncertain export reconciles through before another copy (the S0–S4 law). }
        scope: { $ref: '#/components/schemas/MemoryScope' }
        item_ids:
          type: array
          description: The explicit item subset where the export names one; absent = the scope's items the Core serves.
          items: { type: string }
        destination: { type: string, description: The destination descriptor where the export carries one — displayed before generation, never assumed. }
    MemoryExportResult:
      type: object
      description: The export document — a read-with-output (no item-state change); the honest count, the generation instant, and the honest truncation flag.
      required: [export_operation_id, count, generated_at, truncated, items]
      properties:
        export_operation_id: { type: string, description: The export operation's identity — an uncertain export reconciles through it before another copy (the S0–S4 law). }
        count: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }
        truncated: { type: boolean, description: A range exceeding the finite bound truncates honestly — never silently. }
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryItem' }
    MemoryMutationResult:
      type: object
      description: >-
        One state-confirmed Memory mutation's outcome (the add, edit,
        approve, reject, pin/unpin, and forget members) — the
        Core-confirmed post-state item and the operation reference. Only a
        confirmed 200 carries the outcome truth (the F11 law); the request
        is never displayed as the confirmation (the J-5 rule). The
        operation_id is the reconciliation identity for a lost response
        (the S0–S4 law): reconcile through the operation-status read or
        the item's inspect read BEFORE any retry — never a blind re-issue.
      required: [memory_item, operation_id]
      properties:
        memory_item: { $ref: '#/components/schemas/MemoryItem' }
        operation_id: { type: string, description: The Core-minted operation reference — the reconcile-by-operation-ID identity. }
    MemoryDeleteResult:
      type: object
      description: >-
        The delete member's Core-confirmed outcome — the deletion truth
        and the retention caveat the Core confirms, never a
        total-erasure promise: the retained scope (derived references,
        sync state, backup retention as policy defines) is the
        Core-confirmed statement's. Memory deletion never auto-deletes
        KnowledgePack claims (MB §7.5).
      required: [memory_item_id, outcome_state, operation_id]
      properties:
        memory_item_id: { type: string }
        outcome_state: { $ref: '#/components/schemas/MemoryItemLifecycleState' }
        retention_note: { type: string, description: The Core-confirmed retention caveat where the Core carries one — empty = none reported. }
        operation_id: { type: string, description: The Core-minted operation reference — the reconcile-by-operation-ID identity (a lost destructive response is never assumed to have destroyed). }
    MemoryOperationKind:
      type: string
      description: >-
        The closed memory-operation kind register — add | edit | approve |
        reject | pin | unpin | forget | delete | export | inclusion (the
        operation rows the operation-status endpoint resolves; the
        list/query and inspect reads are correlation-class reads with no
        operation row).
    MemoryOperationState:
      type: string
      description: >-
        The closed memory-operation state register — recorded |
        outcome_unknown. `recorded` carries the Core-confirmed outcome in
        the record's result members; `outcome_unknown` is the S0–S4
        OUTCOME_UNKNOWN surface — a timeout or lost response is never
        proof of success, cancellation, or safe retry; reconcile by the
        operation ID through the operation-status read (or by the item
        identity through the inspect read) BEFORE any retry. A failure is
        a recorded, confirmed outcome — its coded failure rides
        failure_code/failure_reason.
    MemoryOperation:
      type: object
      description: One memory operation's authoritative record — the operation-status endpoint's payload (the S0–S4 unknown-outcome lookup's operation-ID half).
      required: [operation_id, kind, state, created_at, updated_at]
      properties:
        operation_id: { type: string, description: The Core-minted operation reference. }
        kind: { $ref: '#/components/schemas/MemoryOperationKind' }
        state: { $ref: '#/components/schemas/MemoryOperationState' }
        correlation_id: { type: string, description: The operation's correlation ID. }
        memory_item_id: { type: string, description: The item the operation acted on, where one exists. }
        outcome_state: { $ref: '#/components/schemas/MemoryItemLifecycleState' }
        export_ref: { type: string, description: The export artifact's reference where the kind is export. }
        failure_code: { type: string, description: The coded failure (the family's register codes) where the confirmed outcome is a failure; empty otherwise. }
        failure_reason: { type: string, description: The Core-supplied explicit reason — the honest statement, never a suppressed warning. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryErrorCode:
      type: string
      description: >-
        The Memory family's domain codes added to the coded error register
        (F1) additively at the 2026-11-08 publication act — each riding
        the published ErrorEnvelope with its retryable value and the coded
        retryClass. MEMORY_SCOPE_VIOLATION (never — a read/write crossing
        the forbidden cross-scope default; MB §7.5),
        MEMORY_SECRETS_REJECTED (never — a write attempting secret
        storage; the BINDING secrets law, MB §12.2 law 3),
        MEMORY_ITEM_NOT_FOUND (never — the unknown or out-of-scope item,
        the SAME typed 404 — the no-leak rule),
        MEMORY_REVIEW_STATE_CONFLICT (never — approve/reject against an
        item not in the required review state), MEMORY_CONFLICT (reconcile
        — the correction/conflict path's concurrent-edit outcome; reconcile
        by re-reading the item's authoritative state, never overwrite),
        MEMORY_NOT_EDITABLE (never — the eligibility law's refusal; the
        Core owns eligibility). The idempotency/state conflicts ride the
        PUBLISHED codes exactly — CONFLICT_IDEMPOTENCY_KEY (same key +
        different body) and CONFLICT_STATE (replay past the window).
    MemoryEventAggregateType:
      type: string
      description: The Memory family's F10 aggregate types — memoryItem | memoryReviewOperation.
    MemoryEventType:
      type: string
      description: >-
        The Memory family's F10 event_type vocabulary —
        memory_candidate.extracted | memory_item.added |
        memory_review.approved | memory_review.rejected |
        memory_item.updated | memory_item.pinned | memory_item.unpinned |
        memory_item.expired | memory_item.forgotten | memory_item.deleted.
        `memory_item.forgotten` is DISTINCT from `memory_item.deleted` —
        THE FORGET/DELETE DISTINCTNESS (recorded at the 2026-11-09
        resolution act, binding on this family): forget and delete are
        DISTINCT Core semantics at the register level — the forgotten
        lifecycle state and the memory_item.forgotten event vs the deleted
        state and the memory_item.deleted event — both riding the SAME
        M-16 removal discipline (the content dropped; the identity
        tombstone retains identity/scope/state; the retention caveat
        identical; no immediate-total-erasure promise).
        `memory_candidate.extracted` is the sensitivity check's routing
        event (auto-save low-risk vs approval-required). Events ride the
        frozen F10 EventRecord field set with the C1-08 cursor semantics
        (opaque, stream/workspace-scoped, authorization-checked cursors;
        dedup by event_id; reconcile by the per-aggregate monotonic
        sequence; at-least-once delivery); events are never the source of
        truth — the authoritative state reads are.
    ContextSnapshotMetadataExtension:
      type: object
      description: >-
        The ADDITIVE metadata extension of the served Job-flow snapshot
        read (F5 /jobs/{id}/snapshot → SnapshotView) toward the Core MB
        §7.3 required-metadata list — the CF-3 draft's 15-row extension
        map, materialized canonical by the 2026-11-08 publication act.
        This extension NEVER duplicates, redefines, or modifies the served
        SnapshotView or its member schemas (SnapshotItem, SnapshotOmission,
        SnapshotBudgetRequested, SnapshotBudget): the served read stays
        the boundary of what the Core serves about a context today, the
        delivered Jobs-flow presentation is untouched, and the served
        members it carries (task_ref, user_input_digest, included,
        omitted, budget, compression_method, retrieval_config_version,
        estimator_version, renderer_version, assembled_digest) are the
        published forms this extension extends — never restated here.
        Every member below is present only where the Core reports it —
        absence is the honest unreported state, never a synthesized
        value. RECORDED GAPS (never fabricated members): the
        tool-result/previous-output item-class vocabulary is unsupplied
        (the CF-3 draft row 3 — no member exists); the provider/Core
        usage-reporting fields are UNSUPPLIED — the owner's PROPOSED
        decision (the CF-3 draft §3(f)), the honest "not yet reported"
        state applies and nothing is extrapolated (row 8; the
        honest-absence law rides used_budget); the privacy/
        data-classification decisions are the Core's — no UI-minted
        member exists (row 10); the prompt/template/system-instruction
        and output-schema version refs are unsupplied (row 12 — no
        member exists); the concrete pack/claim/evidence/source
        breakdown classes are the owner's residual (row 2's residual —
        source_digests records the digests only). This act publishes no
        standalone compiled-context read route: the only snapshot route
        in existence is F5's, and the future standalone contract composes
        this extension ADDITIVELY alongside the served read.
      properties:
        workflow_ref:
          type: string
          description: >-
            The owning workflow's reference where the Core reports one
            (the MB §7.3 request's owning task/workflow/run class — the
            served task_ref extended; the CF-3 draft row 1's extension).
            A reference string carried in snapshot metadata only: the
            Workflow family's Run rows stay GATED (D-40) and this member
            makes no cross-family wire claim.
        run_ref:
          type: string
          description: >-
            The owning run's reference where the Core reports one (the
            MB §7.3 class; the CF-3 draft row 1's extension). A reference
            string carried in snapshot metadata only: the Run rows stay
            GATED (D-40/CF-4) — no cross-family wire claim is made.
        source_digests:
          $ref: '#/components/schemas/ContextSnapshotSourceDigests'
        compression_version:
          type: string
          description: The compression's version where the Core reports one (the served compression_method extended — the CF-3 draft row 4's extension).
        source_snapshot_refs:
          type: array
          description: The source-snapshot references where the Core reports them (the CF-3 draft row 4's extension; the references are the Core's own identity strings).
          items: { type: string }
        used_budget:
          $ref: '#/components/schemas/ContextSnapshotUsedBudget'
        model_ref:
          type: string
          description: >-
            The model/provider target the Core reports for the compilation
            (the MB §7.3 class; the CF-3 draft row 7's extension, keyed
            per the published F2 CapabilityDescriptor class).
            Optimization/target metadata — NEVER canonical context
            identity and never a context identifier (the P1.5 R5 law;
            P4.6 ST-1/F-6).
        capability_profile:
          allOf:
            - $ref: '#/components/schemas/ProfileID'
          description: >-
            The capability profile the compilation resolved through where
            the Core reports one — keyed per the published F2
            CapabilityDescriptor class (the CF-3 draft row 7's keying).
            The descriptor's own "no capability promise exists — C3-29's
            frozen boundary" rides unchanged.
        snapshot_digest:
          type: string
          description: >-
            A digest over the snapshot record itself where the Core
            reports one (the served assembled_digest is the payload's
            digest — this member is the record's; the CF-3 draft row 11's
            extension). The algorithm-qualified digest form
            `sha256:<lowercase-hex>` is carried as a value format for
            description only — the D-41 portable digest profile stays
            behind its owner technical/security gate; this contract does
            not approve SHA-256 or any algorithm as the permanent digest
            profile.
        policy_signature_refs:
          type: array
          description: The applicable policy/signature references where the Core reports them (the CF-3 draft row 11's extension; the signature/digest profile classes cite the B1 family AS PROPOSED behind D-41's gate — the references are the Core's own identity strings).
          items: { type: string }
        provider_adapter_version:
          type: string
          description: The provider-adapter's version where the Core reports one (the served renderer_version extended — the CF-3 draft row 14's extension).
        representation_version:
          type: string
          description: The exact rendered request/context representation's version, including tool schemas and ordering, where the Core reports one (the CF-3 draft row 15's extension; the served assembled_digest carries the payload's digest — this member versions the representation).
        raw_payload_stored:
          type: boolean
          description: >-
            Whether the raw rendered payload is retained — the Core's
            policy/retention decision (MB §7.3: the raw rendered payload
            is stored only when policy/retention permits, otherwise
            source refs + the digest). The raw payload is never rendered
            where the Core's policy does not permit it (the P4.6 §3.2
            row 13 law). Absent = the Core reports no statement — never
            inferred.
    ContextSnapshotSourceDigests:
      type: object
      description: >-
        The selected pack/claim/evidence/source digests beyond the served
        flat included items (the MB §7.3 class; the CF-3 draft row 2's
        extension) — the served per-item form (SnapshotItem) is flat and
        untouched. The typed pack/claim/evidence/source breakdown's
        concrete classes are the owner's residual (recorded in the CF-3
        draft): this object records the digests the Core reports per
        class and defines no pack/claim/evidence wire shape (the pack
        classes cite the B1 family AS PROPOSED — no cross-family claim;
        pack_ref and the review-sources form remain the compatibility
        anchors). An absent member = the Core reports no digest for the
        class — never fabricated.
      properties:
        packs:
          type: array
          description: The selected packs' digests where the Core reports them. The algorithm-qualified digest form `sha256:<lowercase-hex>` is carried as a value format for description only — the D-41 gate stands; no algorithm is approved as the permanent digest profile.
          items: { type: string }
        claims:
          type: array
          description: The selected claims' digests where the Core reports them. The algorithm-qualified digest form `sha256:<lowercase-hex>` is carried as a value format for description only — the D-41 gate stands; no algorithm is approved as the permanent digest profile.
          items: { type: string }
        evidence:
          type: array
          description: The selected evidence's digests where the Core reports them. The algorithm-qualified digest form `sha256:<lowercase-hex>` is carried as a value format for description only — the D-41 gate stands; no algorithm is approved as the permanent digest profile.
          items: { type: string }
        sources:
          type: array
          description: The selected sources' digests where the Core reports them. The algorithm-qualified digest form `sha256:<lowercase-hex>` is carried as a value format for description only — the D-41 gate stands; no algorithm is approved as the permanent digest profile.
          items: { type: string }
    ContextSnapshotUsedBudget:
      type: object
      description: >-
        The used budget and the provider-overhead extension (the MB §7.3
        requested/used budget class; the CF-3 draft row 6's extension) —
        the served requested form (SnapshotBudgetRequested) and the Core
        estimate (SnapshotBudget) are untouched; reserved output IS
        already served in the requested form. THE USAGE-REPORTING
        HONESTY LAW: the provider/Core usage-reporting fields are
        UNSUPPLIED — the owner's PROPOSED decision (the CF-3 draft
        §3(f)); the honest "not yet reported" state applies until they
        exist (P4.6 ST-6) — a member is present only where the Core
        reports it, never extrapolated, never synthesized.
      properties:
        used_input_tokens:
          type: integer
          description: The input tokens the Core accounts as used, where the Core reports them (absent = not yet reported — never extrapolated).
        used_output_tokens:
          type: integer
          description: The output tokens the Core accounts as used, where the Core reports them (absent = not yet reported — never extrapolated).
        provider_overhead_tokens:
          type: integer
          description: The provider-overhead tokens the Core reports, where the Core reports them (absent = not yet reported — never extrapolated).
    ContextSnapshotSaveRequest:
      type: object
      description: >-
        The save-snapshot member's body — the M-19 Core-confirmed command
        class. The idempotency key is scoped workspace + request context
        Core-side; the fingerprint is the request identity (the
        correlation ID). CONDITIONAL on durable snapshot storage existing
        (the owner's PROPOSED decision): hidden entirely in the UI while
        unsupported, never a dead stub.
      required: [idempotency_key, correlation_id, source_job_id]
      properties:
        idempotency_key:
          type: string
          description: >-
            The M-19 idempotency key — scoped workspace + request context
            Core-side. Same key + same request identity replays the
            recorded save while the operation is live or within the
            selected replay window — 72 h after the operation's terminal
            transition (the F6-precedent window, selected at this act per
            the CF-3 draft's offered candidate); the same key with a
            different request identity is 409 CONFLICT_IDEMPOTENCY_KEY; a
            replay past the window is 409 CONFLICT_STATE.
        correlation_id:
          type: string
          description: The request's correlation ID — the fingerprint's identity and the reconcile identity for a lost response (the S0–S4 law).
        source_job_id:
          type: string
          description: The compilation Job whose snapshot is saved — the served F5 flow's identity (/jobs/{id}/snapshot); the save persists that compiled context's snapshot for the stated request context. The Job's policy-snapshot law carries (MB §12.3).
    ContextSnapshotSaveResult:
      type: object
      description: >-
        One save's accepted outcome — the operation reference
        (replayed=true on the M-19 same-request-identity replay). 202 =
        accepted for processing, never completion (the F6 law); the
        authoritative operation-state read confirms every outcome; the
        request is never displayed as the confirmation (the J-5 rule).
      required: [operation, replayed]
      properties:
        operation: { $ref: '#/components/schemas/ContextOperation' }
        replayed: { type: boolean }
    ContextSnapshotCompareRequest:
      type: object
      description: >-
        The compare member's body — the M-20 read-only class. READ-ONLY
        and CONDITIONAL on stable Core comparison existing (the GC-4
        un-gate precondition) — never a fabricated diff.
      required: [baseline_snapshot_id, candidate_snapshot_id]
      properties:
        baseline_snapshot_id:
          type: string
          description: The baseline snapshot's identity (the served SnapshotView's snapshot_id class).
        candidate_snapshot_id:
          type: string
          description: The candidate snapshot's identity (the served SnapshotView's snapshot_id class).
    ContextSnapshotCompareResult:
      type: object
      description: >-
        The compare member's Core-reported output — the read-with-output
        result (mutates nothing). The comparison content is the Core's
        own stable comparison output — this contract defines no
        diff/delta vocabulary of its own; a compare runs ONLY where
        stable Core comparison exists and no diff is ever fabricated.
      required: [baseline_snapshot_id, candidate_snapshot_id, comparison]
      properties:
        baseline_snapshot_id: { type: string }
        candidate_snapshot_id: { type: string }
        comparison:
          type: object
          additionalProperties: true
          description: >-
            The Core's own stable comparison output, exactly as the Core
            reports it. Where stable Core comparison does not exist the
            family answers CONTEXT_COMPARE_UNSUPPORTED instead — the
            comparison-unavailable state renders honestly.
    ContextInclusionRequest:
      type: object
      description: >-
        The per-request memory-inclusion member's body — the M-18
        request-scoped decision. It applies ONLY to the stated request,
        changes no Memory item's lifecycle state, creates no Memory
        action row (the P4.6 §4 boundary), and never widens any scope.
      required: [correlation_id, request_ref, decisions]
      properties:
        correlation_id:
          type: string
          description: The request's correlation ID — the fingerprint's first half.
        request_ref:
          type: string
          description: The stated request reference — the ONLY scope this decision applies to (the key scope is the stated request/scope ONLY; retention request-lifetime at most).
        decisions:
          type: array
          description: The per-item inclusion decisions for the stated request.
          items:
            type: object
            required: [memory_item_id, included]
            properties:
              memory_item_id:
                type: string
                description: The memory item the decision concerns (the per-request MEMORY-inclusion decision's class — cited AS PROPOSED by the CF-3 draft from the B2 family's row).
              included:
                type: boolean
                description: Whether the item is included in the stated request's compiled context.
    ContextInclusionResult:
      type: object
      description: >-
        The per-request memory-inclusion member's Core-confirmed outcome —
        a decision record for the stated request ONLY, never an item-state
        change and never a Memory action row.
      required: [request_ref, decisions]
      properties:
        request_ref: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [memory_item_id, included]
            properties:
              memory_item_id: { type: string }
              included:
                type: boolean
                description: The Core-confirmed inclusion for the stated request.
              reason:
                type: string
                description: The Core-reported outcome reason where the Core's context policy reports one — carried verbatim, never synthesized; absence is the absence (the Core-provided-only reason law).
    ContextOperationKind:
      type: string
      description: >-
        The closed context-operation kind register — save_snapshot (the
        M-19 Core-confirmed command class; CONDITIONAL on durable
        snapshot storage existing — the GC-3 un-gate precondition, the
        owner's PROPOSED decision: while unsupported the command stays
        hidden entirely in the UI, never a dead stub, and no operation
        row can exist). The compare is the read-with-output class and the
        inclusion decision is request-scoped — neither carries a durable
        operation row; the compilation itself remains the served Job flow
        (F5/getJobStatus) — never duplicated here.
    ContextOperationState:
      type: string
      description: >-
        The closed context-operation state register — accepted | saved |
        failed | outcome_unknown. `accepted` is the submit confirmation
        (202 = accepted for processing, never completion — the F6 law).
        `saved` is the Core-confirmed terminal state (the snapshot
        durably stored under the selected 72 h post-terminal retention
        window). `failed` carries the explicit failure code and reason —
        never a suppressed warning. `outcome_unknown` is the S0–S4
        OUTCOME_UNKNOWN surface: a timeout or lost response is never
        proof of success or safe retry — reconcile by the operation ID
        through the authoritative state read.
    ContextOperation:
      type: object
      description: One context operation's authoritative record — the state endpoint's payload (the S0–S4 unknown-outcome lookup's operation-ID half).
      required: [operation_id, kind, state, correlation_id, created_at, updated_at]
      properties:
        operation_id: { type: string, description: The Core-minted operation reference. }
        kind: { $ref: '#/components/schemas/ContextOperationKind' }
        state: { $ref: '#/components/schemas/ContextOperationState' }
        correlation_id: { type: string, description: The operation's correlation ID. }
        source_job_id:
          type: string
          description: The source compilation Job where the operation carries one (the served F5 flow's identity — the Job read stays the compilation's authoritative state, never duplicated here).
        result:
          type: object
          description: The Core-confirmed saved-snapshot reference once the operation carries it — present only on the Core-confirmed saved outcome.
          properties:
            snapshot_id:
              type: string
              description: The Core-confirmed saved snapshot's identity (the served SnapshotView's snapshot_id class).
            retention_note:
              type: string
              description: The Core-confirmed retention statement where the Core carries one (the selected window is 72 h post-terminal); empty = none reported.
        failure_code:
          type: string
          description: The coded failure (the family's register codes) where the confirmed outcome is a failure; empty otherwise.
        failure_reason:
          type: string
          description: The Core-supplied explicit reason — the honest statement, never a suppressed warning.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContextErrorCode:
      type: string
      description: >-
        The Context family's domain codes added to the coded error
        register (F1) additively at the 2026-11-08 publication act — each
        riding the published ErrorEnvelope with its retryable value and
        the coded retryClass (the per-code retryable values are this
        publication act's assignments following the CF-3 draft §3(i)
        retryClass proposals, stated here).
        CONTEXT_BUDGET_EXHAUSTED (never — the budget-exhaustion outcome
        producing the explicit omission/partial-context record; the
        no-silent-truncation budget law, MB §18 — a repeat with the same
        budget re-exhausts; the omission record is the explicit outcome,
        not a transient failure), CONTEXT_OMISSION_REASON_UNAVAILABLE
        (safe-retry — the typed carrier for the honest reason-unavailable
        state: the Core reports an omission without a reason and the
        absence is displayed as the absence, never a synthesized reason,
        P4.6 ST-3), CONTEXT_COMPILATION_UNAVAILABLE (safe-retry — the
        compilation/preview cannot be served; the unavailable state
        renders honestly, never a fabricated state, P4.6 ST-9/C7),
        CONTEXT_COMPARE_UNSUPPORTED (safe-retry — compare attempted
        without stable Core comparison support; safe to re-issue as a
        read-only effect-free read while the outcome persists until
        support exists — the GC-4 law; never a fabricated diff),
        CONTEXT_SNAPSHOT_NOT_FOUND (never — the unknown snapshot/operation
        identity, the SAME typed 404 for unknown and out-of-scope — the
        no-leak rule; the typed-404 pattern is the published precedent).
        The idempotency/state conflicts ride the PUBLISHED codes exactly —
        CONFLICT_IDEMPOTENCY_KEY (same key + different request identity)
        and CONFLICT_STATE (replay past the window).
    ContextEventAggregateType:
      type: string
      description: >-
        The Context family's F10 aggregate types — contextSnapshot |
        contextCompilation (proposed by the CF-3 draft; materialized
        canonical by this act). Events ride the frozen F10 EventRecord
        field set; events are never the source of truth (MB §14.2) — the
        authoritative state endpoint is.
    ContextEventType:
      type: string
      description: >-
        The Context family's F10 event_type vocabulary —
        compilation.omission_recorded | snapshot.saved |
        compilation.actual_reported (proposed by the CF-3 draft;
        materialized canonical by this act). `compilation.omission_recorded`
        is the explicit omission record (the no-silent-truncation budget
        law, MB §18). `snapshot.saved` is recorded CONDITIONAL on durable
        snapshot storage existing — the GC-3 un-gate precondition is the
        owner's PROPOSED decision and no snapshot.saved event can exist
        while it is open. `compilation.actual_reported` is recorded
        CONDITIONAL on the provider/Core usage-reporting fields existing
        — the owner's PROPOSED decision; where unreported, the honest
        "not yet reported" state stands (P4.6 ST-6) and nothing is
        extrapolated. Events ride the frozen F10 EventRecord field set
        with the C1-08 cursor semantics (opaque, stream/workspace-scoped,
        authorization-checked cursors; dedup by event_id; reconcile by
        the per-aggregate monotonic sequence; at-least-once delivery);
        the F10 replay-retention window stays the recorded Proposed 30
        days/stream open choice — not disposed by this act; events are
        never the source of truth — the authoritative state endpoint is.
    WorkflowDefinition:
      type: object
      description: >-
        One workflow definition's identity record. Workflow Definitions
        are immutable and versioned (Core MB §8.1): editing creates a NEW
        immutable revision; each Run keeps its own durable graph
        revision/history — a Run of revision R executes R forever,
        whatever the definition's later revisions are; AI replanning never
        silently mutates a historical graph. The three states stay
        distinct (the plan's non-negotiable rule): the unsaved draft
        (client-local — never Core state); the current immutable stored
        revision; each Run of a specific revision.
      required: [definition_id, created_at]
      properties:
        definition_id:
          type: string
          description: The Core-minted definition identity — never client-carried (the Core-mints law; the published precedent, createConversation).
        display_name:
          type: string
          description: The Core-carried display name where one exists; absence is the absence.
        current_revision_ref:
          type: string
          description: The Core-reported current immutable revision reference, where a stored revision exists; a definition with no saved revision carries none (the authoritative state read confirms).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkflowDefinitionList:
      type: object
      description: The keyset page (the published keyset list pattern) — the cursor's absence marks the final page.
      required: [definitions]
      properties:
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
        next_cursor:
          type: string
          description: The opaque cursor; absent on the final page (the published keyset pattern).
    WorkflowRevision:
      type: object
      description: >-
        One immutable revision record. The revision identity's wire form
        is an opaque Core-owned reference — no digest-keyed identity is
        published (the D-41 digest classes stay gated; where a future
        digest member enters this family it publishes ONLY in the
        algorithm-qualified string form `sha256:<lowercase-hex>` as a
        value FORMAT inside descriptions — the CF-1 precedent note — and
        no algorithm is approved as the permanent digest profile).
      required: [revision_ref, created_at]
      properties:
        revision_ref:
          type: string
          description: The opaque Core-owned revision reference — stable, immutable, always reachable.
        created_at: { type: string, format: date-time }
    WorkflowDraftNode:
      type: object
      description: >-
        One draft node — the client-local authoring unit. The node
        vocabulary CLASS is carried here in descriptions only (Core MB
        §8.1's typed set: Trigger → Knowledge/Retrieve → LLM/Tool/Plugin
        → Transform/Condition → Parallel/Join → HumanApproval/Wait →
        Checkpoint/Subworkflow → Result; the compound entries name related
        classes whose final split into distinct Core-owned types the
        Core's node-schema contract defines); every concrete per-node
        value stays UNSUPPLIED [B4]: no node catalogue and no per-node
        schema is published here (P4.7 owns the catalogue and the
        ten-dimension discipline — input schema; output schema; required
        capability; permission; data egress; side effects;
        idempotency/retry safety; timeout/resource budget; checkpoint;
        errors and the result where returned — every node contract carries
        all ten dimensions; the Core-owned supported set is narrower until
        contracted and the UI exposes only the contracted types). config
        is open-typed because the per-node schema is UNSUPPLIED [B4] —
        the Core validates it against its own contract. The
        Parallel/Join-propagation and Subworkflow-nesting dimensions are
        DOUBLY blocked (B4 + the D-40 open decisions — Run/Job
        cardinality, nested-workflow behavior, and retry/cancel/pause
        propagation stay OPEN).
      required: [node_ref, node_type, config]
      properties:
        node_ref:
          type: string
          description: The draft-local node reference the Core echoes in validation results (the exact-object labeling law's linkage anchor — never Core-minted).
        node_type:
          type: string
          description: The node type as the draft declares it — the Core validates against its own catalogue; a type the active Core does not contract is WORKFLOW_UNKNOWN_NODE_TYPE.
        config:
          type: object
          additionalProperties: true
          description: The node's configuration — open-typed; the per-node schema is UNSUPPLIED [B4] and the Core's node-schema contract owns it.
    WorkflowDraftEdge:
      type: object
      description: One draft edge — the client-local connection between two draft nodes.
      required: [edge_ref, from_node, to_node]
      properties:
        edge_ref:
          type: string
          description: The draft-local edge reference the Core echoes in validation results.
        from_node:
          type: string
          description: The source node_ref.
        to_node:
          type: string
          description: The target node_ref.
    WorkflowDraftContent:
      type: object
      description: >-
        The draft's graph content — the client-local authoring state the
        family's write-path operations carry. The draft is never Core
        state until a save-revision confirms one: validation and run
        submission never silently save a draft unless stated AND
        Core-confirmed (UI §17.7; the no-silent-save law).
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDraftNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDraftEdge'
    WorkflowCreateRequest:
      type: object
      description: The create body — the aggregate-create class. The Core mints the definition identity; the body never carries one.
      required: [idempotency_key, correlation_id, display_name]
      properties:
        idempotency_key:
          type: string
          description: The create idempotency key — scoped workspace Core-side; its fingerprint is the request identity (the correlation ID); the replay window is 72 h post-terminal (the F6-precedent candidate, selected at this act per the CF-4 draft §3(g)'s proposal).
        correlation_id:
          type: string
          description: The request identity — the fingerprint the selected replay window keys on; the unknown-outcome reconcile anchor before any retry (the S0–S4 law).
        display_name:
          type: string
          description: The definition's display name as the user states it.
    WorkflowCreateResult:
      type: object
      description: The Core-confirmed created definition and the replay datum (the Supplied-keyed replay pattern — a replay returns the recorded outcome, never a regenerated identity).
      required: [definition, replayed]
      properties:
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        replayed:
          type: boolean
          description: True when the keyed replay returned the recorded create — the same Core-minted identity, never a second one.
    WorkflowValidateRequest:
      type: object
      description: >-
        The validate body. The evaluated object's identity rides the
        request so the result labels EXACTLY which draft or revision it
        evaluated (the exact-object labeling law — validation of one
        object is never presented as another object's result, RUN-LINK-2).
      required: [correlation_id, draft]
      properties:
        correlation_id:
          type: string
          description: The operation's correlation ID — the read-class identity; none-required idempotency (the result-reference read class).
        definition_id:
          type: string
          description: The definition the draft belongs to, where the draft edits an existing definition; absent for a new definition's draft.
        draft:
          $ref: '#/components/schemas/WorkflowDraftContent'
    WorkflowValidationIssue:
      type: object
      description: >-
        One Core-owned typed validation issue — linkable to the offending
        node/edge by its draft-local reference. The UI invents no error
        category, warning class, or count (P4.1 B19): every member here is
        the Core's typed output.
      required: [issue_class, message]
      properties:
        issue_class:
          type: string
          description: The closed issue-class register — blocking_error | non_blocking_warning | permission_gap | schema_compatibility (the four typed classes CF-4 §3(d) carries).
        node_ref:
          type: string
          description: The offending node's draft-local reference where the issue links to a node.
        edge_ref:
          type: string
          description: The offending edge's draft-local reference where the issue links to an edge.
        code:
          type: string
          description: The family's register code where one applies (e.g. WORKFLOW_UNKNOWN_NODE_TYPE, WORKFLOW_NODE_PERMISSION_DENIED).
        message:
          type: string
          description: The Core-reported statement — carried verbatim, never synthesized.
    WorkflowValidationResult:
      type: object
      description: >-
        The Core-authoritative typed validation result. Core-side
        authoritative: schema, policy, capability, resource, privacy, and
        side-effect checks run in the Core before execution; CLIENT CHECKS
        ARE ADVISORY and labeled as such at the point of display — a local
        validation result is never a truth source. Run stays disabled
        until validation passes or identified non-blocking warnings are
        explicitly acknowledged — the acknowledgment is a visible, explicit
        user act, never a timeout, never implicit, never a dismissed toast
        (VRC-VAL-2). The exact-object labeling law applies (the
        evaluated_object_ref). This operation is read-like: it mutates no
        stored revision and NEVER silently saves the draft (the
        no-silent-save law).
      required: [evaluated_object_ref, blocking_errors, warnings, permission_gaps, schema_compatibility]
      properties:
        evaluated_object_ref:
          type: string
          description: The exact-object label — which draft or revision this result evaluates (the exact-object labeling law).
        blocking_errors:
          type: array
          description: The typed blocking errors — each linkable to the offending node/edge.
          items:
            $ref: '#/components/schemas/WorkflowValidationIssue'
        warnings:
          type: array
          description: The typed non-blocking warnings — each linkable to the offending node/edge.
          items:
            $ref: '#/components/schemas/WorkflowValidationIssue'
        permission_gaps:
          type: array
          description: The typed permission gaps — a node type requiring a capability/permission the current principal lacks (RUN-LINK-8; the Core re-checks authoritatively — client-side permission filtering is presentation, not enforcement).
          items:
            $ref: '#/components/schemas/WorkflowValidationIssue'
        schema_compatibility:
          type: array
          description: The typed schema-compatibility findings — each linkable to the offending node/edge.
          items:
            $ref: '#/components/schemas/WorkflowValidationIssue'
    WorkflowRevisionSaveRequest:
      type: object
      description: >-
        The save-revision body — the M-21 class. The save creates a NEW
        immutable revision; the response states the new revision ID; the
        old revision is preserved immutable and reachable — there is NO
        update-in-place (the NO-silent-overwrite law). The concurrency
        contract is Open behind UI-30: RFC 9110 If-Match is a possible
        standard mechanism, not a UI-mandated wire contract — the client
        does not assert If-Match or another concurrency protocol unless
        Core implements and documents it; NO If-Match/ETag/precondition
        member exists in this contract and none is added by this family
        (the interim conflict rule governs instead). The save never
        silently saves a draft as a side effect of any other operation.
      required: [idempotency_key, correlation_id, base_revision_ref, draft]
      properties:
        idempotency_key:
          type: string
          description: The save idempotency key — scoped workspace + definition ID Core-side; its fingerprint is the correlation ID + the revision's current state reference (the M-21 class); the replay window is 1 h post-terminal (the short-window M-16-class precedent, selected at this act per the CF-4 draft §3(g)'s proposal).
        correlation_id:
          type: string
          description: The request identity — half of the idempotency fingerprint; the reconcile anchor after a lost response.
        base_revision_ref:
          type: string
          description: The revision the draft was based on — the revision's current state reference (the fingerprint's other half); the Core's concurrent-revision detection input (WORKFLOW_REVISION_CONFLICT on conflict). The detection mechanism itself is Core-contract-owned and Open (the If-Match clause above); this member carries the client's known base and asserts no protocol.
        draft:
          $ref: '#/components/schemas/WorkflowDraftContent'
    WorkflowRevisionSaveResult:
      type: object
      description: >-
        The Core-confirmed save outcome — the NEW revision reference
        STATED on save; the old revision preserved immutable and
        reachable. The draft's dirty state clears only on this
        confirmation — never a pre-emptive "saved" label. A typed Core
        rejection leaves the draft surviving byte-for-byte, visibly so;
        nothing is overwritten. A lost response reconciles by the
        authoritative definition/revision-state read BEFORE any retry
        (VRC-LOST-1; the S0–S4 law) — never a blind retry, never an
        update-in-place.
      required: [revision_ref, replayed]
      properties:
        revision_ref:
          type: string
          description: The NEW immutable revision's Core-owned reference — stated on save.
        replayed:
          type: boolean
          description: True when the keyed replay returned the recorded save — the same revision, never a second one.
    WorkflowAIDiffProposeRequest:
      type: object
      description: >-
        The AI-diff propose body — the M-23 class. The proposal generation
        is a Core call producing untrusted reviewable TEXT; the approval
        that follows is DRAFT-LOCAL and carries no Core write (the
        approval saves nothing and runs nothing — the subsequent save
        carries its own row and its own class).
      required: [correlation_id, draft, instruction]
      properties:
        correlation_id:
          type: string
          description: The operation's correlation ID — none-required idempotency (a draft-local generation with no stored artifact).
        definition_id:
          type: string
          description: The definition the draft belongs to, where the draft edits an existing definition; absent for a new definition's draft.
        draft:
          $ref: '#/components/schemas/WorkflowDraftContent'
        instruction:
          type: string
          description: The user's stated request for the proposal — carried verbatim to the Core's proposal path; the proposal output is never treated as a command (the untrusted-input law).
    WorkflowAIDiffProposal:
      type: object
      description: >-
        THE AI-PROPOSAL LAW (binding as carried): AI-proposed diffs are
        UNTRUSTED REVIEWABLE TEXT — they cannot grant permissions, mint
        capabilities, execute, or change system instructions; approval is
        EXPLICIT and is the USER's — the user is the approval authority
        (P1.6 M-23); AI changes are never auto-saved, never auto-run,
        never executed without explicit user approval; the approval itself
        saves nothing and runs nothing — the approved change enters the
        DRAFT and then follows the normal laws. Escape, dismissal,
        navigation, or a timeout NEVER approves and NEVER silently
        discards the DRAFT (VRC-AI-2). The proposal renders as a
        reviewable diff — old region / new region. The Run/step rows stay
        GATED [D-40 + the stack] — nothing here enables any execution.
      required: [old_region, new_region, untrusted_label]
      properties:
        old_region:
          type: string
          description: The reviewable old region of the proposed diff — untrusted TEXT, rendered as received.
        new_region:
          type: string
          description: The reviewable new region of the proposed diff — untrusted TEXT, rendered as received.
        untrusted_label:
          type: string
          description: The published UntrustedLabel register value — the closed register `untrusted`; the proposal is untrusted data that cannot grant permissions or change system instructions.
    WorkflowRunHistoryEntry:
      type: object
      description: >-
        One run-history entry — a LINKAGE record, NOT the D-40-blocked Run
        schema: it carries no Run/step lifecycle vocabulary, no run-state
        register, no step model, and no Run/Job cardinality claim (the
        D-40 remainder — Run/Job cardinality, nested-workflow behavior,
        and retry/cancel/pause propagation — stays OPEN). The Run ↔
        source-revision link is immutable and Core-owned: the entry
        renders the link ONLY as the Core reports it — missing linkage
        renders `unavailable`, NEVER an inferred link (RUN-LINK-3). Where
        a Run resolves to a durable Job submission, the published F6/F7/F9
        classes govern at that future act — cited here, never extended.
        Editing and saving a new revision leaves every entry's link intact
        — no history is rewritten by any edit, conflict resolution, AI
        diff, failed save, or guard discard (RUN-LINK-12).
      required: [run_ref, linkage_state]
      properties:
        run_ref:
          type: string
          description: The Core-owned opaque run reference — rendered as reported.
        source_revision:
          type: string
          description: The Core-reported source-revision reference — the revision the Run executed; absent where the Core reports no link.
        linkage_state:
          type: string
          description: The closed linkage register — linked | unavailable. `unavailable` is the honest state for a missing linkage — never an inferred link.
        created_at:
          type: string
          format: date-time
          description: The Core-reported record time where one exists.
    WorkflowRunHistory:
      type: object
      description: The run-history read's payload — a pure read; each entry beside its Core-reported source revision.
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunHistoryEntry'
    WorkflowDefinitionState:
      type: object
      description: >-
        The authoritative definition/revision-state record — the family's
        authoritative state endpoint's payload (a pure query). Events are
        never the source of truth; this endpoint is. The three states stay
        distinct: the client's unsaved draft is NEVER Core state (the
        no-silent-save law); the current immutable stored revision is
        reported here; each Run of a specific revision keeps its own
        durable revision. The unknown identity and the out-of-scope
        identity are the SAME typed 404 (the no-leak rule). Reconnect and
        recovery: cursor replay where supported, then authoritative
        refetch (the four-step recovery plan; the gap message).
      required: [definition_id]
      properties:
        definition_id:
          type: string
          description: The stated definition identity.
        current_revision_ref:
          type: string
          description: The Core-reported current immutable revision reference; absent where no revision exists yet.
        updated_at:
          type: string
          format: date-time
          description: The Core-reported state time where one exists.
    WorkflowErrorCode:
      type: string
      description: >-
        The Workflow family's domain codes added to the coded error
        register (F1) additively at the 2026-11-08 publication act — each
        riding the published ErrorEnvelope with its retryable value and
        the coded retryClass (the per-code retryable values are this
        publication act's assignments following the CF-4 draft §3(k)
        retryClass proposals, stated here).
        WORKFLOW_VALIDATION_FAILED (never — the Core-owned typed
        blocking-error outcome; the result is a fact about the evaluated
        object, not a transient failure; the exact-object labeling law
        applies), WORKFLOW_WARNING_UNACKNOWLEDGED (never — a save or run
        attempted while identified non-blocking warnings requiring
        acknowledgment are unacknowledged; the acknowledgment is the
        user's explicit act — never a timeout, never implicit, never a
        dismissed toast; a retry without acknowledgment re-fails
        deterministically), WORKFLOW_REVISION_CONFLICT (never — the
        concurrent-revision outcome; the interim conflict rule governs:
        without an approved policy no overwrite and no merge is performed,
        both sides are shown separately and labeled, the draft is
        preserved, and the conflict state persists until the user resolves
        it — never auto-resolved, never timed out into a resolution, never
        resolved by a refresh; the resolution never rewrites a historical
        revision or any Run's source-revision link),
        WORKFLOW_UNKNOWN_NODE_TYPE (never — a node type the active Core
        does not contract; the palette source is ONLY the Core-contracted
        node vocabulary, never a client-side list; no placeholder node can
        be saved or run), WORKFLOW_NODE_PERMISSION_DENIED (never — a node
        requiring a capability/permission the current principal lacks; the
        Core's validation and the single decision port re-check
        authoritatively — client-side permission filtering is
        presentation, not enforcement), WORKFLOW_NOT_SAVED (never — an
        operation attempted against a draft that is not a Core-confirmed
        saved revision; the no-silent-save law). The idempotency/state
        conflicts ride the PUBLISHED codes exactly —
        CONFLICT_IDEMPOTENCY_KEY (same key + different request identity)
        and CONFLICT_STATE (replay past the window).
    WorkflowEventAggregateType:
      type: string
      description: >-
        The Workflow family's F10 aggregate types — workflowDefinition |
        workflowRevision (proposed by the CF-4 draft; materialized
        canonical by this act). Events ride the frozen F10 EventRecord
        field set; events are never the source of truth (MB §14.2) — the
        authoritative state endpoint is.
    WorkflowEventType:
      type: string
      description: >-
        The Workflow family's F10 event_type vocabulary — revision.created
        | revision.remote_changed | validation.completed (proposed by the
        CF-4 draft; materialized canonical by this act). NO Run/step
        lifecycle event exists in this vocabulary — that vocabulary is a
        GATED row (D-40 + the stack: C1-10 designs no Run schema while
        D-40 stands) and nothing here drafts one. THE NO-SECOND-RUN-JOURNAL
        LAW (carried, binding as recorded): no second UI-side run journal
        and no separate Workflow-Run event stream exists while the D-40
        mapping stands. `revision.created` records each NEW immutable
        revision's creation; `revision.remote_changed` records the
        concurrent-revision outcome's remote-change signal — the interim
        conflict rule governs its rendering (both sides shown; the draft
        preserved; the conflict state persists until the user resolves
        it); `validation.completed` records the Core-authoritative typed
        validation result's completion for the exact evaluated object (the
        exact-object labeling law applies to events too). Events ride the
        frozen F10 EventRecord field set with the C1-08 cursor semantics
        (opaque, stream/workspace-scoped, authorization-checked cursors;
        dedup by event_id; reconcile by the per-aggregate monotonic
        sequence; at-least-once delivery); the F10 replay-retention window
        stays the recorded Proposed 30 days/stream open choice — not
        disposed by this act; events are never the source of truth — the
        authoritative state endpoint is.
    PluginManifest:
      type: object
      description: >-
        The plugin manifest structure — the declared fields carried
        EXACTLY from the approved basis (Core MB §10.1's list): plugin
        ID/version; publisher/trust metadata; artifact digest/signature;
        ABI version; requested capabilities; compatibility range;
        declared resource needs; license/SBOM reference; lifecycle state.
        THE NEVER-GRANT LAW (binding): the plugin itself can NEVER grant
        permissions — not to itself, not to anything else; the user
        grants/denies; the Core mediates and enforces (Core MB §10.1; UI
        §19.3; the consuming permission-review specification's flow —
        never un-gated here). THE ABI LAW (carried; Core MB §10.3): the
        ABI version is SEPARATE from the host capability version;
        requests/responses are schema-validated; an unknown required
        capability is rejected; host calls re-check user/workspace scope
        and permissions per call; plugin output is untrusted and never
        mints new privileges. THE PROVEN-ONLY QUOTA LAW (binding): the
        manifest declares resource needs; the Core enforces the limits;
        the surface displays ONLY Core-returned, PROVEN limits — never a
        computed, assumed, or documented-in-theory budget;
        per-instruction CPU/fuel quota must NOT be assumed; wall-clock
        timeout is NOT fuel (the wazero caveat carried) — no limit number
        appears anywhere in this contract. THE D-41 NOTE (the gate stays
        GATED): digest and signature members carry values only in the
        algorithm-qualified string form (`sha256:<lowercase-hex>`) as a
        value FORMAT — no algorithm is approved by this contract as the
        permanent digest profile; the D-41 gate keeps its recorded state.
        The compatibility-range representation, the concrete ABI version
        values, and the declared-resource wire representation are
        UNSUPPLIED [B5] — the Core's contract decides; this record
        carries the structure, not the values.
      required: [manifest_version, plugin_id, plugin_version]
      properties:
        manifest_version:
          type: string
          description: The manifest format version as declared — the Core validates the manifest (the verdict law — manifest validation for admission is the Core's).
        plugin_id:
          type: string
          description: The plugin identity as declared — the Core mints the authoritative plugin identity at admission (the identity law; never client-minted).
        plugin_version:
          type: string
          description: The plugin version as declared.
        publisher_ref:
          type: string
          description: The publisher/trust metadata reference as declared — a declaration only; trust is NEVER inferred from it (a digest match is NOT publisher trust; a signature is NOT proof of safe behavior; a downloaded source is NOT verified — the trust-word discipline).
        artifact_digest:
          type: string
          description: The artifact digest as declared — the algorithm-qualified string form (`sha256:<lowercase-hex>`) as a value FORMAT only (the D-41 note). A digest establishes content identity relative to compared bytes ONLY — never publisher authorization, authenticity, safety, or factual truth (the digest/truth-separation law).
        artifact_signature:
          type: string
          description: The artifact signature as declared — verified by the Core only; the verification RESULT is Core-returned (PluginPackage), never computed UI-side (the verdict law).
        abi_version:
          type: string
          description: The plugin's ABI version — SEPARATE from the host capability version (Core MB §10.3); the concrete values are UNSUPPLIED [B5].
        requested_capabilities:
          type: array
          items: { type: string }
          description: The capability names the manifest requests — the CLASS the approved basis carries only; the concrete enumerated capability set, each request's scope, and the grant-scope class (global / workspace-scoped / invocation-scoped) are UNSUPPLIED [B5] — NO capability catalogue is published here. A declared name the active Core does not contract is unknown to it — an unknown required capability is rejected, Core-side.
        compatibility_range:
          type: string
          description: The declared host-compatibility range — its representation is UNSUPPLIED [B5]; the Core's compatibility check is authoritative (the verdict law; the UI performs no compatibility determination of its own).
        declared_resource_needs:
          type: string
          description: The declared resource needs — the Core enforces the limits; the PROVEN-only law governs any display (no assumed fuel; wall-clock timeout is NOT fuel). The wire representation is UNSUPPLIED [B5].
        license_ref:
          type: string
          description: The license/SBOM reference as declared.
        lifecycle_state:
          type: string
          description: The lifecycle-state field the manifest list carries (Core MB §10.1's list carried exactly) — the AUTHORITATIVE lifecycle state is the Core-returned one on the plugin record and the state read; the state-machine wire values are UNSUPPLIED [B5] and no register is invented here.
    PluginPackage:
      type: object
      description: >-
        The package structure — the package is admitted only through the
        Core's verification: the artifact digest, the signature
        verification result, the trust root, and the rotation/revocation
        status are each CORE-RETURNED verification states the UI renders,
        NEVER computes (the consuming register's carried structure; the
        digest/truth-separation law — a digest establishes content
        identity relative to compared bytes ONLY, never publisher
        authorization, authenticity, safety, or factual truth). Approved
        sources and the package format are the Core's enumeration; a
        local import exists only when the Core implements validation +
        quarantine. THE TRUST-WORD DISCIPLINE (binding, carried):
        "Verified," "Trusted," and "Installed" appear ONLY after the
        corresponding Core evidence and policy conditions are met. THE
        D-41 NOTE rides the digest member: the algorithm-qualified string
        form (`sha256:<lowercase-hex>`) as a value FORMAT only — no
        algorithm approved; the D-41 gate stays GATED.
      required: [package_ref]
      properties:
        package_ref:
          type: string
          description: The Core-owned package identity — Core-minted, never client-minted (the identity law).
        artifact_digest:
          type: string
          description: The Core-verified artifact digest — the algorithm-qualified string form (`sha256:<lowercase-hex>`) as a value FORMAT only (the D-41 note). The digest/truth-separation law applies.
        signature_verification_result:
          type: string
          description: The Core-returned signature verification result — rendered as returned, never computed UI-side (the verdict law). Absent where the Core returns none.
        trust_root_ref:
          type: string
          description: The Core-returned trust-root reference — rendered as returned, never resolved or chosen UI-side. Absent where the Core returns none.
        rotation_status:
          type: string
          description: The Core-returned trust-rotation status — rendered as returned, never computed. Absent where the Core returns none.
        revocation_status:
          type: string
          description: The Core-returned revocation status — TRUST-REVOKED is DISTINCT from DISABLED and from GRANTS-REVOKED (the distinctness law). Rendered as returned, never computed. Absent where the Core returns none.
    Plugin:
      type: object
      description: >-
        One installed plugin record — the inspect member's payload. THE
        IDENTITY LAW: the Core mints the plugin, package, install-record,
        and grant identities — never client-minted (the published
        Core-mints-the-identity precedent). The record renders ONLY
        Core-returned verification states and lifecycle state; the
        trust-word discipline binds every rendering. THE DISTINCTNESS
        LAWS (carried, binding): DISABLED (the user's action) ≠
        GRANTS-REVOKED ≠ TRUST-REVOKED; INVOCATION TERMINATION ≠ PLUGIN
        DISABLE/REVOCATION (a WASM quota failure terminates THAT
        invocation, preserves Core stability, and emits safe audit
        evidence — it does not disable or revoke the plugin); USER-
        INSTALLED ≠ CATALOG-LISTED (catalog presence is metadata, never a
        trust signal). The state-machine wire values are UNSUPPLIED [B5]
        — the Core's contract decides; no register is invented here. THE
        DUTY SPLIT (binding, carried): REDACTION IS THE CORE'S DUTY — the
        UI displays only Core-returned sanitized content and never
        exposes, requests, or fabricates an unredacted channel.
      required: [plugin_id, lifecycle_state]
      properties:
        plugin_id:
          type: string
          description: The Core-minted plugin identity — never client-minted (the identity law).
        manifest:
          $ref: '#/components/schemas/PluginManifest'
        package:
          $ref: '#/components/schemas/PluginPackage'
        lifecycle_state:
          type: string
          description: The Core-returned authoritative lifecycle state — rendered as returned; the distinctness laws bind its rendering (DISABLED ≠ GRANTS-REVOKED ≠ TRUST-REVOKED); the state-machine wire values are UNSUPPLIED [B5].
        install_record_ref:
          type: string
          description: The Core-minted install-record identity — the reference the C1-07 keyed duplicate returns (the install class).
        installed_at:
          type: string
          format: date-time
          description: The Core-reported install time where one exists.
    PluginList:
      type: object
      description: The lifecycle list read's payload — the keyset page (the published keyset list pattern); the cursor's absence marks the final page. USER-INSTALLED ≠ CATALOG-LISTED, always; catalog presence is metadata, never a trust signal.
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
        next_cursor:
          type: string
          description: The opaque cursor; absent on the final page (the published keyset pattern).
    PluginInstallRequest:
      type: object
      description: >-
        The install body — the recorded C1-07 install class. The Core
        mints the plugin, package, install-record, and grant identities —
        the body never carries one (the identity law). The key is scoped
        workspace + package identity Core-side; the fingerprint is the
        request identity (the correlation ID) + the package artifact
        digest/version reference; the replay window is 72 h post-terminal
        (the keyed creation-class precedent). THE CARRIED ADMISSION
        PIPELINE rides the install member's description (the STRUCTURE;
        the verdict law; the audit-receipt law).
      required: [idempotency_key, correlation_id, package_ref]
      properties:
        idempotency_key:
          type: string
          description: The install idempotency key — scoped workspace + package identity Core-side; a duplicate with the same key returns the install-record reference (the C1-07 class); the same key with a different body is 409 CONFLICT_IDEMPOTENCY_KEY.
        correlation_id:
          type: string
          description: The request identity — the fingerprint's first half; the unknown-outcome reconcile anchor before any retry (the S0–S4 law).
        package_ref:
          type: string
          description: The package artifact/version reference to install — the fingerprint's second half and the reconciliation key (reconcile by package ID/version — NEVER by timeout alone). The Core verifies and admits the package; the admission verdict is the Core's output.
    PluginInstallResult:
      type: object
      description: >-
        The Core-confirmed install outcome — the recorded C1-07 class: a
        duplicate with the same key returns the SAME install-record
        reference, never a second one. The install lands the plugin in
        its installed, NOT-yet-enabled state — activation is separate,
        through the permission review the consuming permission-review
        specification owns (never un-gated here). A lost response
        reconciles by package ID/version through the family's state read
        BEFORE any retry (the S0–S4 law) — never an optimistic
        "Installed".
      required: [install_record_ref, replayed]
      properties:
        install_record_ref:
          type: string
          description: The Core-minted install-record identity — the duplicate replay returns THIS reference, never a new one (the C1-07 class).
        replayed:
          type: boolean
          description: True when the keyed replay returned the recorded install — the same install-record reference, never a second one.
    PluginEnableRequest:
      type: object
      description: The state-toggle body — the recorded M-29 class as the state-toggle class — ONE member operation covers both directions via the target state (the published pin precedent's shape, setMemoryItemPin).
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: The target state — true to enable, false to disable. DISABLED (the user's action) is DISTINCT from GRANTS-REVOKED and from TRUST-REVOKED (the distinctness law); THE DISABLE→ENABLE REVIEW RULE (recorded at the 2026-11-09 resolution act, binding) — a disable→enable cycle does NOT re-open the permission review; the review rides ACTIVATION (the first enable) and the fresh-review law rides UPDATE (changed capabilities); disabling never changes the grant set.
    PluginUpdateRequest:
      type: object
      description: >-
        The update body — the recorded M-30 class. THE FRESH-REVIEW LAW
        (binding): ANY permission change triggers a FRESH review of the
        changed set — the update does not complete past an un-reviewed
        change. THE ATOMIC UPGRADE (binding; Core MB §10.3): no artifact
        overwrite while an old active plugin runs — the prior version
        keeps running until the Core confirms the switch.
      required: [idempotency_key, correlation_id, target_version_ref]
      properties:
        idempotency_key:
          type: string
          description: The update idempotency key — scoped workspace + package identity Core-side; the replay window is 1 h post-terminal; the same key with a different request identity is 409 CONFLICT_IDEMPOTENCY_KEY.
        correlation_id:
          type: string
          description: The request identity — the fingerprint's first half; the unknown-outcome reconcile anchor before any retry (the S0–S4 law).
        target_version_ref:
          type: string
          description: The target package version reference — the fingerprint's second half and the reconciliation key (reconcile by package ID/version — never by timeout alone).
    PluginMutationRequest:
      type: object
      description: The keyed mutation body shared by the remove and revoke-grants members (the recorded M-31 and G7 classes) — the plugin identity rides the path; the key scope and any grant-scope component are Core-side (the grant identity is Core-owned; the grant-scope class is UNSUPPLIED [B5]).
      required: [idempotency_key, correlation_id]
      properties:
        idempotency_key:
          type: string
          description: The mutation idempotency key — scoped workspace + plugin identity Core-side (revoke adds the grant-scope component Core-side); the replay window is 1 h post-terminal; the same key with a different request identity is 409 CONFLICT_IDEMPOTENCY_KEY; a replay past the window is 409 CONFLICT_STATE.
        correlation_id:
          type: string
          description: The request identity — the fingerprint; the unknown-outcome reconcile anchor before any retry (the S0–S4 law).
    PluginMutationResult:
      type: object
      description: >-
        The Core-confirmed mutation outcome — the enable/disable, update,
        remove, and revoke-grants members' shared result shape (the
        published mutation-result precedent, MemoryMutationResult). THE
        ATOMIC UPGRADE law binds the update member (the prior version
        keeps running until the Core confirms the switch); THE
        REMOVE-VS-REVOKE DISTINCTNESS (recorded at the 2026-11-09
        resolution act, binding on this family): removal and grant
        revocation are DISTINCT Core semantics — removing a plugin does
        not revoke its grants; revoking grants does not remove the
        artifact; each acts only on its own named object; revocation
        blocks FUTURE invocations and the current
        invocation's behavior is Core-reported — never guessed. A lost
        response reconciles through the family's authoritative state read
        BEFORE any retry (the S0–S4 law) — never an optimistic
        confirmation.
      required: [plugin_id, operation_ref, replayed]
      properties:
        plugin_id:
          type: string
          description: The Core-minted plugin identity the mutation applied to.
        operation_ref:
          type: string
          description: The Core-minted operation reference — the reconciliation anchor for the lost-response lookup (never a timeout-inferred state).
        replayed:
          type: boolean
          description: True when the keyed replay returned the recorded outcome — the same Core-confirmed result, never a second mutation.
    PluginState:
      type: object
      description: >-
        The authoritative plugin-state record — the family's
        authoritative state endpoint's payload (a pure query). Events are
        never the source of truth; this endpoint is. The distinctness
        laws bind the rendered state (DISABLED ≠ GRANTS-REVOKED ≠
        TRUST-REVOKED; INVOCATION TERMINATION ≠ PLUGIN DISABLE/REVOCATION
        — a WASM quota failure terminates THAT invocation, preserves Core
        stability, and emits safe audit evidence — never disables or
        revokes the plugin). The state-machine wire values are UNSUPPLIED
        [B5] — the Core's contract decides. The unknown identity and the
        out-of-scope identity are the SAME typed 404 (the no-leak rule).
        Reconnect and recovery: cursor replay where supported, then
        authoritative refetch (the four-step recovery plan and the gap
        message).
      required: [plugin_id, lifecycle_state]
      properties:
        plugin_id:
          type: string
          description: The Core-minted plugin identity.
        lifecycle_state:
          type: string
          description: The Core-returned authoritative lifecycle state — rendered as returned; the distinctness laws bind its rendering.
        package_ref:
          type: string
          description: The Core-owned package reference where one exists.
        install_record_ref:
          type: string
          description: The Core-minted install-record reference where one exists.
        updated_at:
          type: string
          format: date-time
          description: The Core-reported state time where one exists.
    PluginErrorCode:
      type: string
      description: >-
        The Plugin family's domain codes added to the coded error
        register (F1) additively at the 2026-11-08 publication act — each
        riding the published ErrorEnvelope with its retryable value (the
        per-code retryable values are this publication act's assignments
        following the CF-5 draft §3(k) retryClass routing, stated here),
        each naming the admission/lifecycle check whose typed outcome it
        carries (the consuming admission decision table's mutually
        exclusive states).
        PLUGIN_TRUST_UNKNOWN (reconcile — the UNKNOWN admission state's
        outcome: publisher/trust root unverified or not determinable by
        the Core; the state can change only Core-side — reconcile through
        the authoritative state read before any retry, never a blind
        resubmit), PLUGIN_SIGNATURE_INVALID (never — the signature
        verification failure; a DISTINCT typed INVALID outcome; a fact
        about the submitted bytes; a retry of the same bytes re-fails
        deterministically), PLUGIN_DIGEST_MISMATCH (never — the digest
        mismatch; a DISTINCT typed INVALID outcome; a fact about the
        submitted bytes), PLUGIN_MANIFEST_INVALID (never — the
        malformed-manifest outcome; a DISTINCT typed INVALID outcome; a
        fact about the submitted manifest), PLUGIN_ABI_INCOMPATIBLE
        (never — the INCOMPATIBLE state's outcome: the ABI/runtime
        mismatch; update availability is rendered where the Core reports
        it), PLUGIN_TRUST_REVOKED (never — the REVOKED state's outcome:
        trust revoked; FUTURE invocations blocked and the current
        invocation's behavior Core-reported — never guessed),
        PLUGIN_CAPABILITY_DENIED (never — the DENIED state's outcome:
        policy denies a required capability, or the user denies it in the
        review; a retry never grants — the user's explicit act governs).
        THE SHAPE DECISION (recorded at the 2026-11-09 resolution act,
        binding): the three typed INVALID outcomes
        (PLUGIN_SIGNATURE_INVALID, PLUGIN_DIGEST_MISMATCH,
        PLUGIN_MANIFEST_INVALID) stay three DISTINCT codes — facts about
        different input aspects (the bytes' signature, the bytes'
        digest, the manifest's structure); the Core does not collapse
        them into one typed `data` payload; each stays DISTINCT under
        the consuming table's distinctness law. The idempotency/state
        conflicts ride the PUBLISHED
        codes exactly — CONFLICT_IDEMPOTENCY_KEY (same key + different
        request identity) and CONFLICT_STATE (replay past the window).
    PluginEventAggregateType:
      type: string
      description: >-
        The Plugin family's F10 aggregate type — plugin (proposed by the
        CF-5 draft; materialized canonical by this act). Events ride the
        frozen F10 EventRecord field set; events are never the source of
        truth (MB §14.2) — the authoritative state endpoint is.
    PluginEventType:
      type: string
      description: >-
        The Plugin family's F10 event_type vocabulary —
        plugin.install_completed | plugin.enabled | plugin.disabled |
        plugin.updated | plugin.removed | plugin.grants_revoked |
        plugin.trust_revoked (proposed by the CF-5 draft; materialized
        canonical by this act) — each naming a Core-confirmed lifecycle
        transition. NO invocation/execution event exists in this
        vocabulary — the invocation/execution event vocabulary is a
        GATED row [D-13/D-14 + the Core MB §10.2 runtime proof] and
        nothing here drafts one; the Core MB §17.5 Plugin call reference
        sequence is CITED, never extended (every step is Core-owned; no
        surface observes anything the Core does not report).
        `plugin.grants_revoked` records the grant-revocation transition
        (GRANTS-REVOKED ≠ TRUST-REVOKED ≠ DISABLED — each distinct);
        `plugin.trust_revoked` records the Core's trust-revocation
        transition. Events ride the frozen F10 EventRecord field set with
        the C1-08 cursor semantics (opaque, stream/workspace-scoped,
        authorization-checked cursors; dedup by event_id; reconcile by
        the per-aggregate monotonic sequence; at-least-once delivery);
        the F10 replay-retention window stays the recorded Proposed 30
        days/stream open choice — not disposed by this act; events are
        never the source of truth — the authoritative state endpoint is.
