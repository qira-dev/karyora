      required: [eligible, risk_statement, idempotency_class, reconciliation_required]
      properties:
        eligible: { type: boolean, description: 'Allow only for the terminal Failed/TimedOut dispositions; deny every non-terminal state, NeedsReconciliation, Cancelled, and Succeeded.' }
        risk_statement: { type: string, description: 'The Core-supplied statement rendered WITH the control, in the recorded exact terms — never a footnote.' }
        idempotency_class: { $ref: '#/components/schemas/RetryIdempotencyClass' }
        reconciliation_required: { type: boolean, description: 'True when the state is NeedsReconciliation or any side-effect intent carries an Unknown outcome; rendered `needs reconciliation` — retry is not reversal.' }
    RetryIdempotencyClass:
      type: string
      description: The closed coded guarantee-class register — supplied_keyed | open | none.
