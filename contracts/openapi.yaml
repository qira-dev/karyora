      type: object
      description: One bounded knowledge-pack page (the keyset list semantics).
      required: [packs]
      properties:
        packs:
          type: array
          items: { $ref: '#/components/schemas/KnowledgePack' }
        cursor:
          type: string
          description: Omitted on the final page; the absence is the end marker.
    KnowledgePackVersion:
      type: object
      description: >-
        One immutable pack version (the B1 family): the Core-owned identity,
        the immutable content root, and the explicit supersession
        references. Prior versions are immutable — a source-snapshot change
        creates a new version or an explicit supersession, never edits old
        evidence; immutability is Core-enforced.
      required: [pack_id, version_id, schema_version, pack_root_digest, created_at]
      properties:
        pack_id: { type: string }
        version_id: { type: string, description: 'The Core-owned immutable content root''s identity.' }
        schema_version: { type: integer }
        pack_root_digest:
          type: string
          description: >-
            The version's pack-root digest over the normalized,
            deterministically ordered entry paths, media types and blob
            digests. The algorithm-qualified digest form
            `sha256:<lowercase-hex>` is carried as a value format for
            description only — the D-41 portable digest profile stays behind
            its owner technical/security gate; this contract does not
            approve SHA-256 or any algorithm as the permanent digest
            profile. A digest establishes content identity relative to
            compared bytes only — never publisher authorization,
            authenticity, license compliance, factual truth, or freedom
            from prompt injection.
        entry_count: { type: integer, minimum: 0 }
        claim_count: { type: integer, minimum: 0 }
        evidence_count: { type: integer, minimum: 0 }
        supersedes:
          type: array
          description: The explicit supersession references this version declares.
          items: { type: string }
        superseded_by: { type: string, description: 'The version that explicitly supersedes this one; empty = none.' }
        license: { type: string, description: 'The license metadata — SPDX identifier/expression where applicable.' }
        license_status: { type: string, description: 'known | unknown (the Core-assessed status; unknown renders honestly, never as a license claim).' }
        claims:
          type: array
          description: The version's claims where the Core serves them (the structural read's optional members).
          items: { $ref: '#/components/schemas/KnowledgeClaim' }
        evidence:
          type: array
          description: The version's evidence where the Core serves them.
          items: { $ref: '#/components/schemas/KnowledgeEvidence' }
