        the state of that specific revision. A timeout or lost response
        is NEVER proof of success or safe retry (the S0–S4 model) —
        reconcile by the authoritative definition/revision identity
        through this pure query BEFORE any retry (VRC-LOST-1). The
        client's unsaved draft is never Core state (the no-silent-save
        law); the current immutable stored revision is what this read
        reports. Events are never the source of truth; this endpoint is.
        The unknown identity and the out-of-scope identity are the SAME
        typed 404 (the no-leak rule). Reconnect and recovery: cursor
