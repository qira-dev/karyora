      summary: Read a definition's authoritative revision state (the B4 Workflow family's authoritative state endpoint; a pure query — never a retry).
      description: >-
        The family's authoritative state endpoint — a pure-query
        definition/revision-state read resolved by (workspace, definition
        identity [+ revision identity]) — the published pure-query
        precedents (getAttachmentStatus — a pure query, never a re-upload;
