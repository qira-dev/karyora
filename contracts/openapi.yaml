        the Core-confirmed outcome, never the client's promise (UI §15.4;
        the M-16 retention-caveat rule). Memory deletion NEVER auto-deletes
        KnowledgePack claims (MB §7.5 — the promotion law's boundary; the
        promotion operation itself is the recorded sibling gap, P4.2 §5 —
        NOT part of this family). THE FORGET/DELETE OPEN DISCIPLINE:
        whether forget and delete name distinct Core semantics is
        Core-defined and OPEN (carried per the CF-2 draft §3(d); UI §15.4
        holds either way) — the member names are published per the approved
        operation-group ask and no published text here asserts that two
        distinct operations exist; the Core's actual semantics decide. The
        idempotency key (scoped user + item identity + scope; the
        fingerprint is the correlation ID + the item's current state
        reference) replays the recorded outcome within the selected window
        — 1 h post-terminal (selected at this act per the CF-2 draft's
        per-operation law, the same M-16 short window). A lost destructive
        response is NEVER assumed to have destroyed (the S0–S4 law) —
        reconcile by the operation ID or the item's authoritative state
        read BEFORE any retry. The retry class is reconcile.
      parameters:
        - $ref: '#/components/parameters/MemoryItemId'
      responses:
        '200':
          description: The Core-confirmed deletion outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteResult'
  /memories/{memory_item_id}/forget:
    post:
      operationId: forgetMemoryItem
      summary: Request one memory item's forget (the B2 family; the OPEN-distinctness member).
      description: >-
        The Memory operation group's forget member, published per the
        approved operation-group ask with its distinctness carried OPEN:
        whether forget and delete name distinct Core semantics is
        Core-defined and OPEN (the CF-2 draft §3(d); UI §15.4 holds either
        way) — no published text here asserts that two distinct operations
        exist; the Core's actual semantics decide, and no label promises
        more than the semantics deliver. The M-16 destructive discipline
        governs regardless: the known destructive scope stated before the
        action (the active store, derived references, sync state, and
        backup retention as policy defines), no immediate-total-erasure
        promise, only a confirmed 200 carries the outcome truth, and a lost
        response is never assumed to have forgotten — reconcile by the
        operation ID or the item's authoritative state read BEFORE any
        retry (the S0–S4 law). The idempotency key (scoped user + item
        identity + scope; the fingerprint is the correlation ID + the
        item's current state reference) replays within the selected window
        — 1 h post-terminal (selected at this act per the CF-2 draft's
        per-operation law). The retry class is reconcile.
      parameters:
        - $ref: '#/components/parameters/MemoryItemId'
      responses:
        '200':
          description: The Core-confirmed forget outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryMutationResult'
  /memories/{memory_item_id}/approve:
    post:
      operationId: approveMemoryItem
      summary: Approve one memory item's review (the B2 family; the explicit user review action).
      description: >-
        The Memory operation group's approve member — the explicit user
        action that Core-confirms the review transition (AI-extracted
        content NEVER becomes user-confirmed without it; UI §15.4/§15.5).
        The request is never displayed as the confirmation (the J-5 rule);
        the response's Core-confirmed item state is the truth. Approving an
        item not in the required review state is 409
        MEMORY_REVIEW_STATE_CONFLICT. The M-16 state-checked class: the
        idempotency key (scoped user + item identity + scope; the
        fingerprint is the correlation ID + the item's current state
        reference) replays the recorded outcome within the selected short
        window — 1 h post-terminal (selected at this act per the CF-2
        draft's short-window proposal). A lost response resolves ONLY by
        the authoritative reconcile reads (the S0–S4 law). The retry class
        is reconcile.
      parameters:
        - $ref: '#/components/parameters/MemoryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryReviewRequest'
      responses:
        '200':
          description: The Core-confirmed review outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryMutationResult'
  /memories/{memory_item_id}/reject:
    post:
      operationId: rejectMemoryItem
      summary: Reject one memory item's review (the B2 family; the explicit user review action).
      description: >-
        The Memory operation group's reject member — the explicit user
        action that Core-confirms the review transition; the rejected
        item's disposition follows the Core's semantics — never a silent
        client-side deletion. The request is never displayed as the
        confirmation (the J-5 rule); the response's Core-confirmed item
        state is the truth. Rejecting an item not in the required review
        state is 409 MEMORY_REVIEW_STATE_CONFLICT. The M-16 state-checked
        class: the idempotency key (scoped user + item identity + scope;
        the fingerprint is the correlation ID + the item's current state
        reference) replays the recorded outcome within the selected short
        window — 1 h post-terminal (selected at this act per the CF-2
        draft's short-window proposal). A lost response resolves ONLY by
        the authoritative reconcile reads (the S0–S4 law). The retry class
        is reconcile.
      parameters:
        - $ref: '#/components/parameters/MemoryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryReviewRequest'
      responses:
        '200':
          description: The Core-confirmed review outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryMutationResult'
  /memories/{memory_item_id}/pin:
    post:
      operationId: setMemoryItemPin
      summary: Set one memory item's pin state (the B2 family; the pin/unpin member).
      description: >-
        The Memory operation group's pin/unpin member: pinned=true pins,
        pinned=false unpins — one member operation covering both
        directions. The pin state's register position (a flag vs a
        lifecycle state) is Core-defined (the recorded gap; P4.5 G-6) —
        the Core-confirmed pin state rides the response's item, never a
        client assumption. An unknown outcome resolves by querying the
        item's authoritative state by the item identity, or the
        operation-status read by the operation ID, before a repeat (the
        S0–S4 law). The M-16 state-checked class: the idempotency key
        (scoped user + item identity + scope; the fingerprint is the
        correlation ID + the item's current state reference) replays
        within the selected short window — 1 h post-terminal (selected at
        this act per the CF-2 draft's short-window proposal). The retry
        class is reconcile.
      parameters:
        - $ref: '#/components/parameters/MemoryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPinRequest'
      responses:
        '200':
          description: The Core-confirmed pin state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryMutationResult'
  /memories/{memory_item_id}/inclusion:
    post:
      operationId: setMemoryItemInclusion
      summary: Set one memory item's per-request inclusion (the B2 family; the M-18 request-scoped decision).
      description: >-
        The Memory operation group's per-request-inclusion member — the
        M-18 class: a per-request decision, NOT an item-state change, with
        no global effect. The decision applies ONLY to the stated
        request/scope carried by request_ref — it never widens the item's
        scope, never changes another scope, and the toggle exists ONLY
        where the context policy supports it (else the member is absent,
        never a placeholder; UI §15.2/§15.5). The idempotency fingerprint
        is the request's correlation ID + the included item IDs; the key
        scope is the stated request/scope ONLY; the retention is
        request-lifetime at most (selected at this act per the CF-2
        draft's proposal). A lost response resolves by the
        operation-status read before a repeat (the S0–S4 law). The retry
        class is safe-retry within the request's lifetime.
      parameters:
        - $ref: '#/components/parameters/MemoryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryInclusionRequest'
      responses:
        '200':
          description: The Core-confirmed per-request inclusion decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryInclusionResult'
  /memories/export:
    post:
      operationId: exportMemoryItems
      summary: Export memory items (the B2 family; the read-with-export — mutates nothing).
      description: >-
        The Memory operation group's export member — the recorded M-32
        read-with-output class (the exportAudit precedent): mutates
        nothing, no item-state change, safe to re-issue; the idempotency
        class is none required, NO replay window (selected at this act per
        the CF-2 draft's proposal). The exact export scope is shown before
        generation, never assumed. SECRETS ARE EXCLUDED BY DEFAULT — a
        prohibition, not a preference: no secret value ever enters an
        export artifact (the binding secrets law extends to exports, logs,
        URLs, and error messages). A range exceeding the finite bound
        truncates honestly (truncated=true) — never silently. An uncertain
        export reconciles by its export operation ID before another copy
        (the S0–S4 law). The retry class is safe-retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryExportRequest'
      responses:
        '200':
          description: The export document with the honest count and truncation flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryExportResult'
  /memories/operations/{operation_id}:
    get:
      operationId: getMemoryOperationStatus
      summary: Read one memory operation's authoritative state (the B2 family's authoritative state endpoint; a pure query — never a retry).
      description: >-
        The family's operation-status state endpoint — the operation-ID
        half of the unknown-outcome lookup. Resolved by the operation
        identity; returns the authoritative register state of a Memory
        operation. A timeout or lost response is NEVER proof of success,
        cancellation, or safe retry (the S0–S4 model) — reconcile by the
        operation ID through this pure query, or by the item identity
        through the item's inspect read, BEFORE any retry (the
        reconcile-by-item/operation-ID law). An unresolvable outcome
        surfaces outcome_unknown with the operation reference — never a
        timeout-inferred state. The unknown operation and the out-of-scope
        operation are the SAME typed 404 (the no-leak rule). Events are
        never the source of truth; this endpoint is.
      parameters:
        - $ref: '#/components/parameters/MemoryOperationId'
      responses:
        '200':
          description: The operation's authoritative record.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation: { $ref: '#/components/schemas/MemoryOperation' }
    parameters:
      - $ref: '#/components/parameters/MemoryOperationId'
components:
