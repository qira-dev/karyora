      description: >-
        202 Accepted means accepted for processing, never completion — the
        authoritative operation-state read confirms every outcome. The
        read-with-output class (the recorded M-32 class; the exportAudit
        precedent): safe to re-issue, no durable effect to duplicate — the
        idempotency class is none required, NO replay window (selected at
        the 2026-11-07 publication act). The exact object/category scope
        and the destination are shown before generation. SECRETS ARE
        EXCLUDED BY DEFAULT — a prohibition, not a preference (UI §24.2):
        no secret value ever enters an export artifact. Integrity is
        stated only where digest/signature verification was actually
        performed — never claimed. An uncertain export reconciles by its
        operation ID before another copy (the S0–S4 law). The retry class
