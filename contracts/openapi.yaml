      operationId: listWorkflowRunHistory
      summary: Read a definition's run history beside its Core-reported source revisions (the B4 Workflow family; a pure read).
      description: >-
        The group's run-history query member — a pure read; no
        item-state change. Each entry renders beside its Core-reported
        source revision: the Run ↔ source-revision link is immutable and
        Core-owned; missing linkage renders `unavailable` — NEVER an
        inferred link (RUN-LINK-3). THE D-40 GATE (carried): this read is
        a LINKAGE record, not a Run schema — no Run/step lifecycle
        vocabulary, no run-state register, no Run/Job cardinality claim
        exists here (C1-10 designs no Run schema while D-40 stands; the
        run execution operation stays GATED and is NOT published by this
        family). Where a Run resolves to a durable Job submission, the
        published F6/F7/F9 classes govern at that future act — cited,
        never extended. "Run completed" appears only after the
        corresponding Core evidence and policy conditions are met — never
        from a timeout or a local optimistic update. Old runs and old
