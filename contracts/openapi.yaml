  /plugins:
    get:
      operationId: listPlugins
      summary: List the user's installed plugins (the B5 Plugin family; the keyset list semantics).
      description: >-
        The plugin lifecycle group's list member — the lifecycle
        list/reads class (the recorded M-1 read class). The keyset list
        semantics; the cursor's absence marks the final page (the
        published keyset pattern, listJobs). Correlation-ID class only —
        safe to re-issue; no idempotency row; none required — no replay
        window; the retry class is safe-retry. THE DISTINCTNESS LAW
        (carried, binding): USER-INSTALLED ≠ CATALOG-LISTED, always —
        user-installed artifacts are listed SEPARATELY from
        catalog-listed ones, and catalog presence is metadata, never a
        trust signal; the plan's excluded list holds (no marketplace, no
        trust badges, no one-click install is designed or implied; a
        catalog exists ONLY when the Core supplies one — UNSUPPLIED [B5],
        and none is published here). THE FOUR-GATE STACK (carried,
        binding): B5's own family gate is resolved by this publication
        act, and UI-29, D-13/D-14, and the Core MB §10.2 runtime proof
        KEEP their recorded states — resolving any single gate enables
        nothing; the /plugins surfaces render the recorded gate states
        until the stack resolves. Every protected effect rides the Core's
        single decision port (MB §12.3): principal, resource, action, and
        policy context in; one allow/deny decision out — UI visibility is
        never enforcement — and the concrete resource/action pair names
        are the Core/API owner's residual; no permission policy is
        invented here. Local mode stays role-free; Team role names remain
        NAMES only (D-36 open).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The page; the cursor's absence marks the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginList'
    post:
      operationId: installPlugin
      summary: Install one plugin package (the B5 Plugin family; the recorded C1-07 install class — the Core mints the identities).
      description: >-
        The lifecycle group's install member — the recorded C1-07 install
        class carried EXACTLY: a duplicate with the same key returns the
        install-record reference; the same key with a different body is
        409 CONFLICT_IDEMPOTENCY_KEY; a replay past the window is 409
        CONFLICT_STATE. The replay window is 72 h post-terminal (the
        keyed creation-class precedent — the same class B1's import
        submit, B2's add, and B4's create received; selected at this act
        per the CF-5 draft §3(g) proposals). The key is scoped workspace
        + package identity Core-side; the fingerprint is the request
        identity (the correlation ID) + the package artifact
        digest/version reference. THE IDENTITY LAW: the Core mints the
        plugin, package, install-record, and grant identities — the body
        never carries one (the published Core-mints-the-identity
        precedent, createConversation). THE NEVER-GRANT LAW (binding):
        the plugin itself can NEVER grant permissions — not to itself,
        not to anything else; the user grants/denies; the Core mediates
        and enforces; every grant is explicit, scoped, revocable,
        auditable, and quota-bound. THE CARRIED ADMISSION PIPELINE (the
        STRUCTURE; Core MB §10.1's flow carried exactly):
        signature/digest/version check → manifest validation +
        compatibility check → host policy grants explicit capabilities →
        WASM sandbox + resource limits → host-mediated calls only →
        result schema validation + audit receipt. THE VERDICT LAW
        (binding): every admission verdict is the CORE's output — the UI
        performs no signature check, no digest computation for trust
        purposes, no manifest validation for admission, and no
        compatibility determination of its own; every verification state
        the UI renders is Core-returned. THE AUDIT-RECEIPT LAW: the
        pipeline's final stage's audit receipt rides the Core's audit
        layer — the F12 path with the plugin_id context field being the
        one supplied anchor — never a UI-side journal. A Core-confirmed
        install lands the plugin in its installed, NOT-yet-enabled state
        — activation is separate, through the permission review the
        consuming permission-review specification owns (P4.10 §3.3's
        flow; never un-gated here). A lost or unknown outcome reconciles
        by the authoritative package ID/version through the family's
        state read BEFORE any retry (the S0–S4 law; the recorded
        reconciliation key) — NEVER by timeout alone, never an optimistic
        "Installed". The retry class is reconcile. THE FOUR-GATE STACK
        (carried, binding): UI-29, D-13/D-14, and the Core MB §10.2
        runtime proof keep their recorded states — resolving B5 alone
        enables nothing. Every protected effect rides the Core's single
        decision port (MB §12.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInstallRequest'
      responses:
        '200':
          description: The Core-confirmed install outcome — the install-record reference and the replay datum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallResult'
  /plugins/{plugin_id}:
