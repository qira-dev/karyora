        member exists in the coded vocabulary — the ride's absence IS the
        v1 disposition, the R-A resolution of 2026-11-07; each matrix
        field's presence stays Unverified; the matrix's three absent
        fields carry no carrier in v1 — the 10-A/11-A/12-A resolutions of
        2026-11-07: the error-path retry_after_ms/RATE_LIMITED carrier
