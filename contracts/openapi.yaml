      summary: Save one NEW immutable revision of a workflow definition (the B4 Workflow family; the M-21 class).
      description: >-
        The group's save-revision member — the M-21 class: the save
        creates a NEW immutable revision; the response states the new
        revision ID; the old revision is preserved immutable and
        reachable; there is NO update-in-place (the NO-silent-overwrite
        law; UI §17.7). The draft's dirty state clears only on the
        Core-confirmed confirmation — never a pre-emptive "saved" label. A
        typed Core rejection leaves the draft surviving byte-for-byte,
        visibly so; nothing is overwritten. A concurrent-revision conflict
        is 409 WORKFLOW_REVISION_CONFLICT: the interim conflict rule
        governs — without an approved policy, no overwrite and no merge is
        performed; both sides are shown separately and labeled (the
        current stored revision read-only and the local draft);
        compare/reload/merge appear ONLY as the Core-supported conflict
        semantics define — any choice the contract does not define is
        ABSENT, never approximated by a disabled look-alike; the draft is
        preserved until the user explicitly discards it or a supported
        merge completes and is Core-confirmed; the conflict state persists
        until the user resolves it — never auto-resolved, never timed out
        into a resolution, never resolved by a refresh; the resolution
        never rewrites a historical revision or any Run's source-revision
        link. THE IF-MATCH CLAUSE (verbatim, carried): "RFC 9110 If-Match
        is a possible standard mechanism, not a UI-mandated wire
        contract"; the client does not assert If-Match or another
        concurrency protocol unless Core implements and documents it — no
        If-Match/ETag/precondition member exists in this contract and none
        is added by this family; the interim rule above is the governing
        semantics. THE NO-SILENT-SAVE LAW: validation and run submission
        never silently save a draft unless stated AND Core-confirmed —
        this operation is the save; no other family operation saves. A
        lost response reconciles by the authoritative
        definition/revision-state read BEFORE any retry (VRC-LOST-1; the
        S0–S4 law) — never a blind retry. The retry class is reconcile.
        Every protected effect rides the Core's single decision port (MB
        §12.3); the concrete resource/action pair names are the Core/API
        owner's residual.
      parameters:
        - $ref: '#/components/parameters/WorkflowDefinitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRevisionSaveRequest'
      responses:
        '200':
          description: The Core-confirmed save outcome — the NEW revision reference stated on save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRevisionSaveResult'
    parameters:
      - $ref: '#/components/parameters/WorkflowDefinitionId'
  /workflows/{definition_id}/run-history:
