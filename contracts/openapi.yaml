openapi: 3.2.1
info:
  title: Karyora Core API
  version: 0.1.0
  description: |
    The canonical published contract set of the Karyora Core's durable-execution
    surface — the frozen contract families at their recorded version.

    Version semantics (the P1.5 freeze discipline): a 0.x version carries NO
    stability promise and no external compatibility guarantee. Additive changes
    are safe; a breaking change requires a version bump, an ADR, and fixture
    updates on both schema dialects.

    Frozen families carried by this document (each frozen by its own recorded
    owner LIVE act; the version values recorded at the acts):
      - F1  error envelope (the D-35 four-field envelope; the coded error register)
      - F2  provider/model capability (the coded CapabilitySet vocabulary; the
            descriptor read; the [P] twelve-field matrix's three absent fields
            and the intro ride carry their resolved v1 dispositions (the
            2026-11-07 resolutions) — no carrier added in v1: the error-path
            retry_after_ms/RATE_LIMITED carrier serves the retry law, never a
            capability claim; the region/residency carriers stay adjacent,
            never merged; cost stays zero-coded; the source/verification-
            state/freshness ride stays absent — each field's presence stays
            Unverified)
      - F3  provider credential/connection records and operations
      - F4  the conversation and attachment surface (the conversation/Ask
            laws' family — the implemented conversation mapping (the
            aggregate create, list/search, read, and exchange surfaces)
            plus the attachment operations; the conversation-authority
            mapping RESOLVED canonical (the 2026-11-07 α resolution) — the
            Core-owned durable aggregate with v1-Local conservative scoping
            (M1); authoritative Core-state messages (T1); the stream row per
            the O-a record-only resolution; the one-query keyset list/search
            (S1); the Ask linkage conversation-plane never a Job with
            correlation_id PRIMARY (K1))
      - F5  the context-snapshot read
      - F6  the run submission path (the pre-submit review, the Supplied submit
            idempotency, the 72 h post-terminal replay window)
      - F7  Job / Attempt / lease / artifact (the Job machine, the artifact
            access rule, the approval `Waiting` reason, the Jobs list semantics)
      - F8  permission/approval (the accept/reject command identity)
      - F9  cancellation/retry (the cooperative cancel intent model; the
            retry semantics as supplied; the eligibility read and the retry
            command carried as implemented)
      - F10 the event record, the cursor scope, the replay outcomes
      - F11 the Local/Remote scope (the C-4 logout/revocation commands; the
            select-wire idempotency class RESOLVED canonical — the coded
            Open class exactly as implemented: the per-call correlation ID,
            no idempotency key, no body; the already-active switch is the
            Replayed no-op (the I1 resolution of 2026-11-07))
      - F12 activity/audit (the permission-filtered list and the export;
            the correction stays absent — the recorded verified absence)
      - F13 notification (the grouped list read, the unread counts read,
            the read/unread/clear mutations; the preferences' DEFAULTS stay
            OUT of this published set — the Checkpoint-C path)

    The operation names are the canonical wire vocabulary (the owner's recorded
    decision). The serving paths of the local loopback transport adapter are
    that adapter's own implementation and map onto this published contract;
    this document is the canonical vocabulary, not any one adapter's route table.

    Family F2 (the capability descriptor) was frozen by its own recorded act
    (2026-11-05) and its descriptor read is carried below with the coded
    CapabilitySet vocabulary. The two `capabilities` members inside the F6
    review payload and the F3 test report are resolved onto that same
    canonical CapabilitySet schema (the recorded 2026-11-06 reconciliation
    act) — every member that serves the coded capability facts carries the
    one canonical schema.

    F9 (cancellation/retry) frozen content carried: the cooperative cancel
    intent model as coded — a cancel on a queued Job transitions directly
    to `cancelled`; on a running/waiting Job it records `cancel_requested`
    and the terminal `cancelled` arrives through the state machine; the
    request is never displayed as the confirmation (the authoritative
    state read confirms — the J-5 rule). The retry law: a retry is a NEW
    Attempt of the same Job — never a new Job — and an unknown outcome is
    never blindly retried. The envelope's `data` member carries the
    reserved `retryClass` key with the coded operation-level retry
    classification: never | safe-retry | backoff | reconcile.

    Honest absences (recorded, never invented): the conversation shapes
    carry no answering, assistant-role, stream, stop, or steering member
    and no message-binding member — the Ask surface's v1 disposition IS
    record-only (the O-a resolution of 2026-11-07; a future recorded
    supply may add the path) and a future answer binds, at the class
    level, as the aggregate's `Message` row with the assistant role
    joining the closed register additively at its producer milestone (the
    B1 resolution — no binding member exists in v1); the v1 per-message
    action set IS the empty set (the A1 resolution of 2026-11-07 — the
    copy/open-source/view-request candidates stay recorded for future
    additive supplies); the send's correlation_id is the S4 request
    identity, never an idempotency key — the coded Open class resolved
    canonical (the C1 resolution of 2026-11-07: a duplicate identity on
    the same conversation refuses, never a replay claim); the F4
    attachment gaps' canonical values are RESOLVED (the seven-gap set of
    2026-11-07): the registry contents, the upload identity's class, the
    revision token's form, the rejection codes, the label classes, and
    the access rule ARE the implementation's typed forms carried below;
    the participation policy stays deferred (its recorded owner's); the
    F12 export operation identity and its authorization class are
    RESOLVED (the Q1/R1 resolutions of 2026-11-07 — the implemented
    read-with-export operation IS canonical; the export rides the coded
    audit.read action class, no dedicated member exists); the F12
    correction operation stays absent (the recorded verified absence —
    prior records are never mutated); the F13 preferences' DEFAULTS stay
    OUT of this published set (the Checkpoint-C path — nothing of them
    enters these contracts); the F13 stream transport and the OS-delivery
    surface stay their recorded gates' items (the UI-26/C-6 gate and the
    UI-34 FINAL freeze) and carry no schema content here.

    The local loopback adapter's serving paths for the families carried
    here (the notification paths — GET /v1/notifications, GET
    /v1/notifications/counts, POST /v1/notifications/read, POST
    /v1/notifications/unread, POST /v1/notifications/clear — and the
    conversation, retry, capability, session, audit, and attachment
    paths) are that
    adapter's own non-canonical implementation mapping onto the published
    vocabulary below.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
paths:
  /jobs:
    post:
      operationId: submitJob
      summary: Submit a durable job (F6/F7; the Supplied create idempotency).
      description: >-
        202 Accepted means accepted for processing, never completion. Same
        idempotency key + same input digest replays the original job while it
        is live or within 72 h after its terminal transition; the same key with
        a different body is 409 CONFLICT_IDEMPOTENCY_KEY; a replay past the
        window is 409 CONFLICT_STATE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: Accepted for processing (the Core-confirmed reference).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResult'
    get:
      operationId: listJobs
      summary: List jobs (F7; the keyset list semantics).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobState' }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The page; the cursor's absence marks the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
  /jobs/{id}:
    get:
      operationId: getJobStatus
      summary: Read one job's authoritative state with its current attempt (F7).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job and its current attempt (empty attempt_id = none recorded).
          content:
            application/json:
              schema:
                type: object
                required: [job, attempt]
                properties:
                  job: { $ref: '#/components/schemas/Job' }
                  attempt: { $ref: '#/components/schemas/Attempt' }
    parameters:
      - $ref: '#/components/parameters/JobId'
  /jobs/{id}/events:
    get:
      operationId: listJobEvents
      summary: Read one job's event records (F10).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job's event records in the Core's returned order.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventRecord' }
  /jobs/{id}/result:
    get:
      operationId: getJobResult
      summary: Read one job's stored result (F7; the CAS bytes, digest-re-verified).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The stored result bytes.
          content:
            application/json:
              schema: { type: string, contentEncoding: base64 }
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Request one job's cancellation (F7; 202 = accepted for processing).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Accepted for processing; the authoritative state read confirms.
          content:
            application/json:
              schema: { type: object }
  /jobs/{id}/snapshot:
    get:
      operationId: getJobContextSnapshot
      summary: Read one attempt's context-snapshot structure (F5; no compiled content).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: attempt
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The snapshot's structural view; the compiled content is never carried.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot: { $ref: '#/components/schemas/SnapshotView' }
  /jobs/{id}/approval:
    get:
      operationId: getJobApproval
      summary: Read one job's raised approval request (F8; a read never records a decision).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The latest raised approval, or 404 when none is raised.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval: { $ref: '#/components/schemas/Approval' }
  /jobs/{id}/approvals/accept:
    post:
      operationId: acceptJobApproval
      summary: Accept one approval (F8; the Core-confirmed transition re-queues the job).
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              properties:
                approval_id: { type: string }
      responses:
        '200':
          description: The recorded decision result (replayed=true on a same-decision replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResult'
  /jobs/{id}/approvals/reject:
    post:
      operationId: rejectJobApproval
      summary: Reject one approval (F8; the Core-confirmed transition ends the job failed).
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              properties:
                approval_id: { type: string }
      responses:
        '200':
          description: The recorded decision result (replayed=true on a same-decision replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResult'
  /jobs/review:
    post:
      operationId: reviewJob
      summary: Build the pre-submit review payload (F6; a read that creates nothing).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '200':
          description: The eight-field review payload.
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review: { $ref: '#/components/schemas/ReviewPayload' }
  /connections:
    post:
      operationId: saveConnection
      summary: Save one provider connection (F3; the Supplied create idempotency).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionSaveRequest'
      responses:
        '200':
          description: The saved connection view (replayed=true on a duplicate).
          content:
            application/json:
              schema:
                type: object
                required: [connection, replayed]
                properties:
                  connection: { $ref: '#/components/schemas/ConnectionView' }
                  replayed: { type: boolean }
    get:
      operationId: listConnections
      summary: List connections (F3; the keyset list semantics).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The page; the cursor's absence marks the final page.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectionView' }
                  cursor: { type: string }
  /connections/test:
    post:
      operationId: testConnection
      summary: Run the bounded, read-only connection test (F3; safe re-issue).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionSaveRequest'
      responses:
        '200':
          description: The sanitized test report (a saved test stamps the tested state).
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: '#/components/schemas/ConnectionTestReport' }
                  record:
                    allOf:
                      - $ref: '#/components/schemas/ConnectionRecord'
  /connections/{id}:
    get:
      operationId: getConnection
      summary: Read one connection (F3; masked status, never a secret value).
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: The connection view.
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection: { $ref: '#/components/schemas/ConnectionView' }
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
  /connections/{id}/rotate:
    post:
      operationId: rotateConnection
      summary: Replace one connection's credential under the same handle (F3).
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, writeOnly: true }
      responses:
        '200':
          description: The updated record with the working candidate's response data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionRotateResult'
  /connections/{id}/reauthenticate:
    post:
      operationId: reauthenticateConnection
      summary: Re-enter one connection's credential (F3; the rotate path's cousin).
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, writeOnly: true }
      responses:
        '200':
          description: The updated record with the working candidate's response data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionRotateResult'
  /connections/{id}/delete:
    post:
      operationId: deleteConnection
      summary: Revoke then delete one connection (F3; revocation fails closed).
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: The credential revoked and the record deleted.
          content:
            application/json:
              schema: { type: object }
  /connections/{id}/switch:
    post:
      operationId: switchConnection
      summary: Set one connection active (F3; the minimal M-34 pointer).
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: The active pointer set (replayed=true when already active).
          content:
            application/json:
              schema:
                type: object
                required: [active_connection_id, replayed]
                properties:
                  active_connection_id: { type: string }
                  replayed: { type: boolean }
  /notifications:
    get:
      operationId: listNotifications
      summary: List grouped notifications (F13; the keyset list semantics).
      description: >-
        The grouped list read: one entry per related-object group with the
        collapsed blocks (every meaningful state transition visible), the
        four-way presentation state, and the owning domain's current
        canonical state where supplied. Server-side cursor pagination; the
        cursor's absence marks the final page. Unread counts are never
        locally computed — the counts read is the totals' authority.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/NotificationCategory' }
        - name: read_state
          in: query
          schema: { $ref: '#/components/schemas/NotificationReadState' }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The page; the cursor's absence marks the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
  /notifications/counts:
    get:
      operationId: getNotificationUnreadCounts
      summary: Read the Core-supplied unread counts (F13).
      description: >-
        The stored Core read state's totals (cleared rows excluded); the UI
        renders only these counts — never a locally counted number.
      responses:
        '200':
          description: The unread totals and the per-category counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCounts'
  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark named notifications read (F13; a typed Core outcome).
      description: >-
        The explicit identity set applies all-or-nothing in one transaction;
        the response counts the updated and unchanged rows. Reading a
        notification never implies approval, acknowledgement, or work
        completion — only notification rows change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMutationRequest'
      responses:
        '200':
          description: The typed outcome (updated + unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMutationResult'
  /notifications/unread:
    post:
      operationId: markNotificationsUnread
      summary: Mark named notifications unread (F13; a typed Core outcome).
      description: >-
        The same all-or-nothing mutation frame as the read mark, in the
        opposite direction; the same non-mutation law holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMutationRequest'
      responses:
        '200':
          description: The typed outcome (updated + unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMutationResult'
  /notifications/clear:
    post:
      operationId: clearNotifications
      summary: Clear named notifications (F13; the soft-hide working candidate).
      description: >-
        Cleared rows are retained and excluded from the list and the counts
        (never resurrected); the non-mutation law holds — no
        underlying-domain record changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMutationRequest'
      responses:
        '200':
          description: The typed outcome (updated + unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMutationResult'
  /jobs/{id}/retry-eligibility:
    get:
      operationId: getJobRetryEligibility
      summary: Read one job's retry eligibility (F9; the Core's own verdict — a read that mutates nothing).
      description: >-
        The read returns exactly the four recorded typed members: the
        eligibility verdict (allow only for the terminal Failed/TimedOut
        dispositions), the side-effect risk statement in the recorded exact
        terms, the idempotency guarantee class (the closed register), and
        the reconciliation requirement. No ineligible-reason field exists.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The Core's verdict; the retry command acts only where it allows.
          content:
            application/json:
              schema:
                type: object
                required: [retry_eligibility]
                properties:
                  retry_eligibility: { $ref: '#/components/schemas/RetryEligibility' }
    parameters:
      - $ref: '#/components/parameters/JobId'
  /jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Retry one job (F9; a NEW Attempt of the same Job — never a new Job).
      description: >-
        The Supplied-keyed command: the same idempotency reference returns
        the recorded outcome with replayed=true, never regenerated; a
        contradicting re-issue or a consumed reference is 409 CONFLICT_STATE.
        The eligibility gate is the eligibility read's own verdict object —
        one eligibility truth. Retry is not reversal: no prior record is
        rewritten.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryCommandRequest'
      responses:
        '200':
          description: The retried Job (replayed=true on the same-reference replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryCommandResult'
    parameters:
      - $ref: '#/components/parameters/JobId'
  /providers/{id}/capabilities:
    get:
      operationId: getProviderCapabilities
      summary: Read one wired provider's capability descriptor (F2; a standing read that probes nothing).
      description: >-
        The coded CapabilitySet verbatim — the eleven Feature axes as
        three-state facts (unknown means unsupported, fail closed), the
        limits members (0 = unknown), the estimator ref, and the notes law.
        The read runs no network probe and creates nothing; an identity
        outside the wired set is 404 (the no-leak rule).
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - name: model
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The descriptor resolved through the effective profile (the registered default when no model is supplied).
          content:
            application/json:
              schema:
                type: object
                required: [capability_descriptor]
                properties:
                  capability_descriptor: { $ref: '#/components/schemas/CapabilityDescriptor' }
    parameters:
      - $ref: '#/components/parameters/ProviderId'
  /session/logout:
    post:
      operationId: sessionLogout
      summary: Revoke the presented session (F11; the per-token logout).
      description: >-
        The fail-closed audited command: the operation-specific audit record
        is written BEFORE the effect. The effect is idempotent at the Core,
        but the wire refusal class for a dead credential stays the typed
        AUTHZ_DENIED envelope — a second logout refuses rather than
        reporting a fresh success; only a confirmed 200 carries the
        revocation truth.
      responses:
        '200':
          description: The presented session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLogoutResult'
  /session/revoke-all:
    post:
      operationId: sessionRevokeAll
      summary: Revoke every live session of this instance (F11; the credential-change revocation).
      description: >-
        The same fail-closed audited posture as the per-token logout. The
        response reports the post-effect live-session count — counts only,
        never token material.
      responses:
        '200':
          description: Every live session of the instance invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeAllResult'
  /audit:
    get:
      operationId: listAudit
      summary: List audit records (F12; the permission-filtered, server-side, paginated read).
      description: >-
        Chain sequence descending (newest first — the append-only chain's
        sequence IS the time order), through the coded audit.read read
        class. The optional policy_decision filter is the closed coded
        register; the opaque keyset cursor is a position, not a page
        number; the cursor's absence marks the final page. Read-only — no
        source record is ever dismissed, deleted, or edited.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: policy_decision
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The page; the cursor's absence marks the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
  /audit/export:
    get:
      operationId: exportAudit
      summary: Export audit records in a range (F12; the read-with-export — mutates nothing).
      description: >-
        Chronological order (sequence ascending) — the export document's
        natural reading order. A range exceeding the finite bound truncates
        honestly (truncated=true) — never silently. A point-in-time read:
        no tamper-resistance is added and no integrity receipt is claimed.
        Idempotency class "None required — safe re-issue": the identical
        re-request returns the identical record set. This implemented
        read-with-export operation IS the canonical export identity (the Q1
        resolution of 2026-11-07 — the JSON document artifact; the
        correlation ID the request identity), and its authorization class
        IS the coded audit.read action class (the R1 resolution — no
        dedicated export member exists or is invented).
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: limit
