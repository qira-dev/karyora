  /knowledgepacks/import:
    post:
      operationId: submitKnowledgeImport
      summary: Submit one KnowledgePack import (the B1 family; the M-9 digest-keyed idempotency class).
      description: >-
        202 Accepted means accepted for processing, never completion — the
        authoritative operation-state read confirms every outcome. The
        recorded M-9 idempotency class exactly: the same idempotency key
        with the same SOURCE DIGEST of the submitted bytes replays the
        existing pack-version reference while the operation is live or
        within the selected replay window — 72 h after the operation's
        terminal transition (the F6-precedent window, selected at the
        2026-11-07 publication act); the same key with different bytes is
        409 CONFLICT_IDEMPOTENCY_KEY (fingerprintMatch:false); a replay
        past the window is 409 CONFLICT_STATE. The pack create (destination
        pack absent) and the version create (destination pack present) are
        distinct identity operations (MB §6.2); their duplicate-create
        replay rides the selected short window — 1 h after terminal
        (selected at the same act). A lost response resolves ONLY by the
        authoritative operation-state read — never a blind re-submit (the
        S0–S4 reconcile-by-operation-ID law). The submitted bytes are
        UNTRUSTED: Core-side validation is authoritative for file type,
        size, schema, archive paths, signatures, permissions, network
        destinations, and resource policy (path traversal, symlink,
        decompression bombs, malformed, oversized, recursive-dependency
        defense) — client checks are early feedback only. The retry class
        is reconcile (the digest-keyed replay makes a same-bytes retry
        safe and a different-bytes retry a 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeImportRequest'
      responses:
        '202':
          description: Accepted for processing (the Core-confirmed operation reference).
