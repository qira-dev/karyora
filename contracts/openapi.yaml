        created_at:
          type: string
          format: date-time
          description: The group's newest timestamp (the representative's).
        unread_count: { type: integer }
        repeat_count: { type: integer }
        collapsed:
          type: array
          items: { $ref: '#/components/schemas/NotificationCollapsedBlock' }
        object_state:
          type: string
          description: >-
